<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Infinite Ocean: Spyglass</title>
  <desc id="description">Know what needs you next. Guided work with human authority.</desc>
  <defs>
    <radialGradient id="wash" cx="72%" cy="18%" r="75%">
      <stop offset="0" stop-color="#18a6a1" stop-opacity=".9" />
      <stop offset=".48" stop-color="#075d68" stop-opacity=".48" />
      <stop offset="1" stop-color="#052f39" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="line" x1="0" x2="1">
      <stop stop-color="#bdebdc" />
      <stop offset="1" stop-color="#18a6a1" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="#052f39" />
  <rect width="1200" height="630" fill="url(#wash)" />
  <circle cx="1010" cy="80" r="250" fill="none" stroke="#bdebdc" stroke-opacity=".13" stroke-width="2" />
  <circle cx="1010" cy="80" r="176" fill="none" stroke="#bdebdc" stroke-opacity=".11" stroke-width="2" />
  <g transform="translate(72 64)">
