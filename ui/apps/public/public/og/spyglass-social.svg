  <text x="235" y="365" fill="#fffefb" font-family="Georgia,Times New Roman,serif" font-size="82" font-weight="500" letter-spacing="-3">next.</text>
  <text x="76" y="455" fill="#d7e7e3" font-family="Inter,Segoe UI,sans-serif" font-size="29">Guided work. Governed agents. Human authority.</text>
