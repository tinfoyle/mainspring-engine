    <path d="M13 27c13-8 25-8 39 0M17 37c10-6 20-6 31 0" fill="none" stroke="url(#line)" stroke-linecap="round" stroke-width="5" />
    <text x="82" y="25" fill="#fffefb" font-family="Inter,Segoe UI,sans-serif" font-size="23" font-weight="700" letter-spacing="1">INFINITE OCEAN</text>
    <text x="82" y="51" fill="#bdebdc" font-family="Inter,Segoe UI,sans-serif" font-size="17" font-weight="650" letter-spacing="5">SPYGLASS</text>
  </g>
  <text x="72" y="275" fill="#fffefb" font-family="Georgia,Times New Roman,serif" font-size="82" font-weight="500" letter-spacing="-3">Know what needs</text>
