apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: spyglass-production
  namespace: spyglass-reference
  labels:
    app.kubernetes.io/name: spyglass-production-alerts
    app.kubernetes.io/part-of: spyglass
    app.kubernetes.io/component: observability
spec:
  groups:
    - name: spyglass.http.slo
      interval: 30s
      rules:
        - record: spyglass:http_requests:rate5m
          expr: sum by (service) (rate(spyglass_http_requests_total[5m]))
        - record: spyglass:http_5xx_ratio:rate5m
          expr: sum by (service) (rate(spyglass_http_requests_total{status_class="5xx"}[5m])) / clamp_min(sum by (service) (rate(spyglass_http_requests_total[5m])), 0.000001)
        - record: spyglass:http_duration:p95_5m
          expr: histogram_quantile(0.95, sum by (service, le) (rate(spyglass_http_request_duration_seconds_bucket[5m])))
        - alert: SpyglassHTTPErrorBudgetBurn
          expr: spyglass:http_5xx_ratio:rate5m > 0.05 and spyglass:http_requests:rate5m > 0.1
          for: 10m
          labels: {severity: page, owner: platform-on-call}
          annotations:
            summary: Spyglass service has a sustained HTTP 5xx ratio above 5 percent
            description: "{{ $labels.service }} is returning too many server errors for customer traffic."
            runbook_url: https://github.com/tinfoyle/mainspring-engine/blob/main/docs/production/observability-operations.md#http-error-budget-burn
        - alert: SpyglassHTTPTailLatencyHigh
          expr: spyglass:http_duration:p95_5m > 1 and spyglass:http_requests:rate5m > 0.1
          for: 15m
          labels: {severity: page, owner: platform-on-call}
          annotations:
            summary: Spyglass service p95 HTTP latency exceeds one second
            description: "{{ $labels.service }} has sustained p95 request latency of {{ $value | humanizeDuration }}."
            runbook_url: https://github.com/tinfoyle/mainspring-engine/blob/main/docs/production/observability-operations.md#http-tail-latency
    - name: spyglass.workers
      interval: 30s
      rules:
        - alert: SpyglassRunnableQueueStalled
          expr: max by (worker) (spyglass_worker_status{field=~"(oldest_(ready|pending)|work_oldest_ready)_age_seconds"}) > 300
          for: 10m
          labels: {severity: page, owner: platform-on-call}
          annotations:
            summary: Spyglass runnable work has remained queued for more than five minutes
            description: "{{ $labels.worker }} has a sustained oldest runnable age of {{ $value | humanizeDuration }}."
            runbook_url: https://github.com/tinfoyle/mainspring-engine/blob/main/docs/production/observability-operations.md#runnable-queue-stall
        - alert: SpyglassRouteReceiptCleanupStalled
          expr: max by (worker) (spyglass_worker_status{worker="route-receipt",field="oldest_due_age_seconds"}) > 3600
          for: 30m
          labels: {severity: ticket, owner: platform-on-call}
          annotations:
            summary: Spyglass route receipt cleanup is more than one hour behind
            description: Route receipt retention work has a sustained oldest-due age of {{ $value | humanizeDuration }}.
            runbook_url: https://github.com/tinfoyle/mainspring-engine/blob/main/docs/production/observability-operations.md#runnable-queue-stall
        - alert: SpyglassQueueDeadLetterPresent
          expr: max by (worker) (spyglass_worker_status{field=~"(dead_letter|work_dead_letter)"}) > 0
          for: 5m
          labels: {severity: page, owner: platform-on-call}
          annotations:
            summary: Spyglass queue contains dead-lettered work
            description: "{{ $labels.worker }} reports {{ $value }} dead-lettered records."
            runbook_url: https://github.com/tinfoyle/mainspring-engine/blob/main/docs/production/observability-operations.md#queue-dead-letter
        - alert: SpyglassWorkerMetricsMissing
          expr: absent(spyglass_worker_status{worker="runner-controller"}) or absent(spyglass_worker_status{worker="agent-dispatch"}) or absent(spyglass_worker_status{worker="agent-projection"}) or absent(spyglass_worker_status{worker="work-reconciler"})
          for: 10m
          labels: {severity: page, owner: platform-on-call}
          annotations:
            summary: A critical Spyglass worker metric family is absent
            description: Runner, Agent dispatch/projection, or Work reconciliation health is not observable.
            runbook_url: https://github.com/tinfoyle/mainspring-engine/blob/main/docs/production/observability-operations.md#missing-telemetry
    - name: spyglass.collector
      interval: 30s
      rules:
        - alert: SpyglassCollectorExportFailure
          expr: sum(increase(otelcol_exporter_send_failed_spans{service_name="spyglass-otel-collector"}[5m])) > 0 or sum(increase(otelcol_exporter_enqueue_failed_spans{service_name="spyglass-otel-collector"}[5m])) > 0
          for: 5m
          labels: {severity: page, owner: platform-on-call}
          annotations:
            summary: The Spyglass collector cannot export all accepted spans
            description: Collector export or bounded-queue enqueue failures have persisted for five minutes.
            runbook_url: https://github.com/tinfoyle/mainspring-engine/blob/main/docs/production/observability-operations.md#collector-export-loss
        - alert: SpyglassCollectorRefusingSpans
          expr: sum(increase(otelcol_receiver_refused_spans{service_name="spyglass-otel-collector"}[5m])) + sum(increase(otelcol_processor_refused_spans{service_name="spyglass-otel-collector"}[5m])) > 0
          for: 5m
          labels: {severity: page, owner: platform-on-call}
          annotations:
            summary: The Spyglass collector is rejecting trace data
            description: Receiver or processor refusal indicates invalid, unsafe, or resource-constrained telemetry.
            runbook_url: https://github.com/tinfoyle/mainspring-engine/blob/main/docs/production/observability-operations.md#collector-refusal
        - alert: SpyglassCollectorQueueNearCapacity
          expr: sum(otelcol_exporter_queue_size{service_name="spyglass-otel-collector"}) / clamp_min(sum(otelcol_exporter_queue_capacity{service_name="spyglass-otel-collector"}), 1) > 0.8
          for: 10m
          labels: {severity: ticket, owner: platform-on-call}
          annotations:
            summary: The Spyglass collector export queue is above 80 percent capacity
            description: Sustained queue pressure precedes bounded telemetry loss and requires backend or collector investigation.
            runbook_url: https://github.com/tinfoyle/mainspring-engine/blob/main/docs/production/observability-operations.md#collector-export-loss
        - alert: SpyglassCollectorMetricsMissing
          expr: absent(otelcol_process_uptime{service_name="spyglass-otel-collector"})
          for: 10m
          labels: {severity: page, owner: platform-on-call}
          annotations:
            summary: No Spyglass collector internal telemetry is being scraped
            description: Collector health, refusal, and export-loss signals are unavailable.
            runbook_url: https://github.com/tinfoyle/mainspring-engine/blob/main/docs/production/observability-operations.md#missing-telemetry
