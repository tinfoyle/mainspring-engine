extensions:
  health_check:
    endpoint: 0.0.0.0:13133
    path: /health

receivers:
  otlp/spyglass:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
        max_request_body_size: 1048576
        tls:
          cert_file: /var/run/secrets/spyglass/collector-ingress/tls.crt
          key_file: /var/run/secrets/spyglass/collector-ingress/tls.key
          client_ca_file: /var/run/secrets/spyglass/workload-client-ca/ca.crt
          client_ca_file_reload: true
          min_version: "1.3"
          reload_interval: 1m

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 384
    spike_limit_mib: 96

  # Drop shapes that the Spyglass SDK never emits. Links can carry an
  # uncontrolled tracestate and therefore cause the containing span to be
  # rejected; event names and attributes are canonicalized below.
  filter/spyglass_shape:
    error_mode: propagate
    trace_conditions:
      - Len(span.links) > 0
      - not IsString(resource.attributes["service.name"]) or not IsMatch(resource.attributes["service.name"], "^[a-z][a-z0-9_-]{0,63}$")
      - not IsString(resource.attributes["service.version"]) or not IsMatch(resource.attributes["service.version"], "^[0-9a-f]{40}$")
      - not IsString(resource.attributes["deployment.environment.name"]) or not IsMatch(resource.attributes["deployment.environment.name"], "^[a-z][a-z0-9_-]{0,63}$")
      - not IsString(resource.attributes["spyglass.cell.id"]) or not IsMatch(resource.attributes["spyglass.cell.id"], "^(global|[a-z][a-z0-9-]{1,63})$")
      - not IsString(span.attributes["http.request.method"]) or not IsMatch(span.attributes["http.request.method"], "^(GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS|OTHER)$")
      - span.attributes["http.route"] != nil and (not IsString(span.attributes["http.route"]) or not IsMatch(span.attributes["http.route"], "^[ A-Za-z0-9/{_}:.\\$-]{1,160}$"))
      - span.attributes["spyglass.account.ref"] != nil and (not IsString(span.attributes["spyglass.account.ref"]) or not IsMatch(span.attributes["spyglass.account.ref"], "^[0-9a-f]{32}$"))
      - span.attributes["spyglass.cell.id"] != nil and (not IsString(span.attributes["spyglass.cell.id"]) or not IsMatch(span.attributes["spyglass.cell.id"], "^[a-z][a-z0-9-]{1,63}$"))
      - span.attributes["http.response.status_code"] != nil and (span.attributes["http.response.status_code"] < 100 or span.attributes["http.response.status_code"] > 599)

  # This is a second, collector-owned allowlist. It is intentionally narrower
  # than generic OpenTelemetry semantic conventions and emits no redaction
  # summary containing attacker-selected attribute names.
  redaction/spyglass_allowlist:
    allow_all_keys: false
    allowed_keys:
      - http.request.method
      - http.route
      - http.response.status_code
      - spyglass.account.ref
      - spyglass.cell.id
    summary: silent

  transform/spyglass_canonical:
    error_mode: propagate
    trace_statements:
      - keep_keys(resource.attributes, ["service.name", "service.version", "deployment.environment.name", "spyglass.cell.id"])
      - keep_keys(scope.attributes, [])
      - set(scope.name, "spyglass")
      - set(scope.version, "")
      - set(span.name, "HTTP")
      - set(span.name, span.attributes["http.route"]) where span.attributes["http.route"] != nil
      - set(span.status.message, "")
      - set(span.trace_state, "")
      - keep_keys(spanevent.attributes, [])
      - set(spanevent.name, "event")

  batch:
    timeout: 2s
    send_batch_size: 512
    send_batch_max_size: 1024

exporters:
  otlphttp/backend:
    endpoint: ${env:SPYGLASS_OTEL_BACKEND_ENDPOINT}
    headers:
      Authorization: ${env:SPYGLASS_OTEL_BACKEND_AUTHORIZATION}
    compression: gzip
    encoding: proto
    timeout: 5s
    tls:
      ca_file: /var/run/secrets/spyglass/collector-backend/ca.crt
      insecure: false
      min_version: "1.3"
      reload_interval: 1m
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 5s
      max_elapsed_time: 30s
    sending_queue:
      enabled: true
      num_consumers: 4
      queue_size: 2048
      sizer: items
      block_on_overflow: false

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp/spyglass]
      processors: [memory_limiter, filter/spyglass_shape, redaction/spyglass_allowlist, transform/spyglass_canonical, batch]
      exporters: [otlphttp/backend]
  telemetry:
    resource:
      service.name: spyglass-otel-collector
      deployment.environment.name: ${env:SPYGLASS_ENVIRONMENT}
    logs:
      level: warn
      encoding: json
    metrics:
      level: normal
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
                without_scope_info: true
                without_type_suffix: true
                without_units: true
                with_resource_constant_labels:
                  included: [service.name, deployment.environment.name]
