apiVersion: v1
kind: ServiceAccount
metadata:
  name: runner-controller
  namespace: spyglass-reference
# The controller uses its ordinary projected credential only for exact Job
# create/get/delete calls allowed by runner-rbac.yaml.
automountServiceAccountToken: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: runner-broker
  namespace: spyglass-reference
# The broker requires TokenReview plus exact Pod/Job GETs to bind a projected
# runner token to the controller-created invocation.
automountServiceAccountToken: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: runner
  namespace: spyglass-runners-reference
# Controller-created Jobs disable ordinary mounting and explicitly project a
# short-lived token for the exact broker audience.
automountServiceAccountToken: false
---
