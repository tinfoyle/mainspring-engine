apiVersion: apps/v1
kind: Deployment
metadata: {name: admission-api, namespace: spyglass-reference}
spec:
  replicas: 2
  selector:
    matchLabels: {app.kubernetes.io/name: admission-api}
  template:
    metadata:
      labels: {app.kubernetes.io/name: admission-api, app.kubernetes.io/part-of: spyglass}
    spec:
      serviceAccountName: admission-api
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app.kubernetes.io/name: admission-api}
      containers:
        - name: admission-api
          image: registry.invalid/infinite-ocean/spyglass-engine:release-placeholder
          args: [admission-api]
          ports: [{name: https, containerPort: 8080}]
          env:
            - {name: SPYGLASS_HTTP_ADDRESS, value: ":8080"}
            - {name: SPYGLASS_ADMISSION_CELL_IDS, value: "reference"}
            - {name: SPYGLASS_ADMISSION_MAX_REQUEST_BODY_BYTES, value: "65536"}
            - {name: SPYGLASS_WORKLOAD_CERT_FILE, value: "/var/run/secrets/spyglass/workload/tls.crt"}
            - {name: SPYGLASS_WORKLOAD_KEY_FILE, value: "/var/run/secrets/spyglass/workload/tls.key"}
            - {name: SPYGLASS_WORKLOAD_CA_FILE, value: "/var/run/secrets/spyglass/workload/ca.crt"}
            - {name: SPYGLASS_WORKLOAD_CLIENT_IDENTITIES, value: "spiffe://infiniteocean.net/spyglass/cells/reference/app-api,spiffe://infiniteocean.net/spyglass/cells/reference/agent-dispatch-worker"}
          envFrom:
            - configMapRef: {name: spyglass-global-runtime}
            - secretRef: {name: spyglass-admission-api-secrets}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          volumeMounts:
            - {name: workload-tls, mountPath: /var/run/secrets/spyglass/workload, readOnly: true}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: {drop: [ALL]}
            seccompProfile: {type: RuntimeDefault}
          readinessProbe: {httpGet: {path: /health/ready, port: https, scheme: HTTPS}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /health/live, port: https, scheme: HTTPS}, periodSeconds: 15}
      volumes:
        - name: workload-tls
          secret: {secretName: spyglass-admission-api-workload-tls}
---
apiVersion: v1
kind: Service
metadata: {name: admission-api, namespace: spyglass-reference}
spec:
  selector: {app.kubernetes.io/name: admission-api}
  ports: [{name: https, port: 443, targetPort: https}]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: admission-api, namespace: spyglass-reference}
spec:
  minAvailable: 1
  selector:
    matchLabels: {app.kubernetes.io/name: admission-api}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: admission-api, namespace: spyglass-reference}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: admission-api}
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 60}
