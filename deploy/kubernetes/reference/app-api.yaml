apiVersion: apps/v1
kind: Deployment
metadata: {name: app-api-cell-reference, namespace: spyglass-reference}
spec:
  replicas: 2
  selector:
    matchLabels: {app.kubernetes.io/name: app-api, spyglass.io/cell: reference}
  template:
    metadata:
      labels: {app.kubernetes.io/name: app-api, app.kubernetes.io/part-of: spyglass, spyglass.io/cell: reference}
    spec:
      serviceAccountName: app-api
      terminationGracePeriodSeconds: 45
      containers:
        - name: app-api
          image: registry.invalid/infinite-ocean/spyglass-engine:release-placeholder
          args: [app-api]
          ports: [{name: https, containerPort: 8080}]
          env:
            - {name: SPYGLASS_HTTP_ADDRESS, value: ":8080"}
            - {name: SPYGLASS_CELL_ID, value: "reference"}
            - {name: SPYGLASS_WORK_ADMISSION_ORIGIN, value: "https://admission-api.spyglass-reference.svc.cluster.local"}
            - {name: SPYGLASS_MCP_RESOURCE_METADATA_URL, value: "https://mcp.invalid/.well-known/oauth-protected-resource"}
            - {name: SPYGLASS_WORKLOAD_CERT_FILE, value: "/var/run/secrets/spyglass/workload/tls.crt"}
            - {name: SPYGLASS_WORKLOAD_KEY_FILE, value: "/var/run/secrets/spyglass/workload/tls.key"}
            - {name: SPYGLASS_WORKLOAD_CA_FILE, value: "/var/run/secrets/spyglass/workload/ca.crt"}
            - {name: SPYGLASS_WORKLOAD_CLIENT_IDENTITIES, value: "spiffe://infiniteocean.net/spyglass/workloads/app-router,spiffe://infiniteocean.net/spyglass/workloads/mcp-gateway,spiffe://infiniteocean.net/spyglass/cells/reference/schedule-execution-worker"}
          envFrom:
            - configMapRef: {name: spyglass-cell-reference-runtime}
            - secretRef: {name: spyglass-app-api-cell-reference-secrets}
          resources:
            requests: {cpu: 200m, memory: 256Mi}
            limits: {cpu: "2", memory: 1Gi}
          volumeMounts:
            - {name: workload-tls, mountPath: /var/run/secrets/spyglass/workload, readOnly: true}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: {drop: [ALL]}
            seccompProfile: {type: RuntimeDefault}
          readinessProbe: {httpGet: {path: /health/ready, port: https, scheme: HTTPS}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /health/live, port: https, scheme: HTTPS}, periodSeconds: 15}
      volumes:
        - name: workload-tls
          secret: {secretName: spyglass-app-api-cell-reference-workload-tls}
---
apiVersion: v1
kind: Service
metadata: {name: app-api-cell-reference, namespace: spyglass-reference}
spec:
  selector: {app.kubernetes.io/name: app-api, spyglass.io/cell: reference}
  ports: [{name: https, port: 443, targetPort: https}]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: app-api-cell-reference, namespace: spyglass-reference}
spec:
  minAvailable: 1
  selector:
    matchLabels: {app.kubernetes.io/name: app-api, spyglass.io/cell: reference}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: app-api-cell-reference, namespace: spyglass-reference}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: app-api-cell-reference}
  minReplicas: 2
  maxReplicas: 30
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 60}
