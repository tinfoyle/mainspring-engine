apiVersion: apps/v1
kind: Deployment
metadata: {name: app-api-cell-reference, namespace: spyglass-reference}
spec:
  replicas: 2
  selector:
    matchLabels: {app.kubernetes.io/name: app-api, spyglass.io/cell: reference}
  template:
    metadata:
      labels: {app.kubernetes.io/name: app-api, app.kubernetes.io/part-of: spyglass, spyglass.io/cell: reference}
    spec:
      serviceAccountName: app-api
      terminationGracePeriodSeconds: 45
      containers:
        - name: app-api
          image: registry.invalid/infinite-ocean/spyglass-engine:release-placeholder
          args: [app-api, --cell=reference]
          ports: [{name: http, containerPort: 8080}]
          resources:
            requests: {cpu: 200m, memory: 256Mi}
            limits: {cpu: "2", memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: {drop: [ALL]}
            seccompProfile: {type: RuntimeDefault}
          readinessProbe: {httpGet: {path: /health/ready, port: http}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /health/live, port: http}, periodSeconds: 15}
---
apiVersion: v1
kind: Service
metadata: {name: app-api-cell-reference, namespace: spyglass-reference}
spec:
  selector: {app.kubernetes.io/name: app-api, spyglass.io/cell: reference}
  ports: [{name: http, port: 80, targetPort: http}]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: app-api-cell-reference, namespace: spyglass-reference}
spec:
  minAvailable: 1
  selector:
    matchLabels: {app.kubernetes.io/name: app-api, spyglass.io/cell: reference}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: app-api-cell-reference, namespace: spyglass-reference}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: app-api-cell-reference}
  minReplicas: 2
  maxReplicas: 30
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 60}
