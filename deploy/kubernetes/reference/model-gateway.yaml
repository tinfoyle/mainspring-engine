apiVersion: apps/v1
kind: Deployment
metadata: {name: model-gateway, namespace: spyglass-reference}
spec:
  replicas: 2
  minReadySeconds: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app.kubernetes.io/name: model-gateway}
  template:
    metadata:
      labels: {app.kubernetes.io/name: model-gateway, app.kubernetes.io/part-of: spyglass}
    spec:
      serviceAccountName: model-gateway
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 45
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app.kubernetes.io/name: model-gateway}
        - maxSkew: 1
          minDomains: 2
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels: {app.kubernetes.io/name: model-gateway}
      containers:
        - name: gateway
          image: registry.invalid/infinite-ocean/spyglass-engine:release-placeholder
          args: [model-gateway]
          ports: [{name: https, containerPort: 8443}]
          env:
            - {name: SPYGLASS_HTTP_ADDRESS, value: ":8443"}
            - {name: SPYGLASS_MODEL_GATEWAY_MAX_REQUEST_BODY_BYTES, value: "262144"}
            - {name: SPYGLASS_WORKLOAD_CERT_FILE, value: "/var/run/secrets/spyglass/workload/tls.crt"}
            - {name: SPYGLASS_WORKLOAD_KEY_FILE, value: "/var/run/secrets/spyglass/workload/tls.key"}
            - {name: SPYGLASS_WORKLOAD_CA_FILE, value: "/var/run/secrets/spyglass/workload/ca.crt"}
            - {name: SPYGLASS_WORKLOAD_CLIENT_IDENTITIES, value: "spiffe://infiniteocean.net/spyglass/cells/reference/runner-broker"}
          envFrom:
            - secretRef: {name: spyglass-model-gateway-secrets}
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {cpu: "2", memory: 1Gi}
          volumeMounts:
            - {name: workload-tls, mountPath: /var/run/secrets/spyglass/workload, readOnly: true}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: {drop: [ALL]}
            seccompProfile: {type: RuntimeDefault}
          readinessProbe: {httpGet: {path: /health/ready, port: https, scheme: HTTPS}, periodSeconds: 5}
          startupProbe: {httpGet: {path: /health/live, port: https, scheme: HTTPS}, periodSeconds: 2, failureThreshold: 30}
          livenessProbe: {httpGet: {path: /health/live, port: https, scheme: HTTPS}, periodSeconds: 15}
      volumes:
        - name: workload-tls
          secret: {secretName: spyglass-model-gateway-workload-tls}
---
apiVersion: v1
kind: Service
metadata: {name: model-gateway, namespace: spyglass-reference}
spec:
  selector: {app.kubernetes.io/name: model-gateway}
  ports: [{name: https, port: 443, targetPort: https}]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: model-gateway, namespace: spyglass-reference}
spec:
  minAvailable: 1
  selector:
    matchLabels: {app.kubernetes.io/name: model-gateway}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: model-gateway, namespace: spyglass-reference}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: model-gateway}
  minReplicas: 2
  maxReplicas: 30
  behavior:
    scaleDown: {stabilizationWindowSeconds: 300}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 60}
