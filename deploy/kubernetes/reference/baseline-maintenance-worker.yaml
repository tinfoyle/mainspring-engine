apiVersion: apps/v1
kind: Deployment
metadata: {name: baseline-maintenance-worker-cell-reference, namespace: spyglass-reference}
spec:
  replicas: 2
  selector:
    matchLabels: {app.kubernetes.io/name: baseline-maintenance-worker, spyglass.io/cell: reference}
  template:
    metadata:
      labels: {app.kubernetes.io/name: baseline-maintenance-worker, app.kubernetes.io/part-of: spyglass, spyglass.io/cell: reference}
    spec:
      serviceAccountName: baseline-maintenance-worker
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app.kubernetes.io/name: baseline-maintenance-worker, spyglass.io/cell: reference}
      containers:
        - name: worker
          image: registry.invalid/infinite-ocean/spyglass-engine:release-placeholder
          args: [baseline-maintenance-worker]
          ports: [{name: health, containerPort: 8081}]
          env:
            - {name: SPYGLASS_HEALTH_ADDRESS, value: ":8081"}
            - {name: SPYGLASS_BASELINE_MAINTENANCE_POLL_INTERVAL, value: "1s"}
            - {name: SPYGLASS_BASELINE_MAINTENANCE_LEASE, value: "2m"}
            - {name: SPYGLASS_BASELINE_MAINTENANCE_MAX_ATTEMPTS, value: "10"}
            - {name: SPYGLASS_CELL_MAX_DATABASE_CONNS, value: "3"}
            - {name: SPYGLASS_GLOBAL_MAX_DATABASE_CONNS, value: "3"}
          envFrom:
            - configMapRef: {name: spyglass-baseline-maintenance-worker-cell-reference-restore-checkpoints}
            - secretRef: {name: spyglass-baseline-maintenance-worker-cell-reference-secrets}
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {cpu: "1", memory: 384Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: {drop: [ALL]}
            seccompProfile: {type: RuntimeDefault}
          readinessProbe: {httpGet: {path: /health/ready, port: health}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /health/live, port: health}, periodSeconds: 15}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: baseline-maintenance-worker-cell-reference, namespace: spyglass-reference}
spec:
  minAvailable: 1
  selector:
    matchLabels: {app.kubernetes.io/name: baseline-maintenance-worker, spyglass.io/cell: reference}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: baseline-maintenance-worker-cell-reference, namespace: spyglass-reference}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: baseline-maintenance-worker-cell-reference}
  minReplicas: 2
  maxReplicas: 4
  behavior:
    scaleDown: {stabilizationWindowSeconds: 300}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 65}
