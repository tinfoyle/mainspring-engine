apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: runner-controller, namespace: spyglass-runners-reference}
rules:
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [create, get, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: runner-controller, namespace: spyglass-runners-reference}
subjects:
  - {kind: ServiceAccount, name: runner-controller, namespace: spyglass-reference}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: runner-controller}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: runner-broker-observer, namespace: spyglass-runners-reference}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: runner-broker-observer, namespace: spyglass-runners-reference}
subjects:
  - {kind: ServiceAccount, name: runner-broker, namespace: spyglass-reference}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: runner-broker-observer}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: spyglass-reference-runner-token-reviewer}
rules:
  - apiGroups: [authentication.k8s.io]
    resources: [tokenreviews]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: spyglass-reference-runner-token-reviewer}
subjects:
  - {kind: ServiceAccount, name: runner-broker, namespace: spyglass-reference}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: spyglass-reference-runner-token-reviewer}
