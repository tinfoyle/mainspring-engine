apiVersion: apps/v1
kind: Deployment
metadata: {name: mcp-gateway, namespace: spyglass-reference}
spec:
  replicas: 2
  minReadySeconds: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app.kubernetes.io/name: mcp-gateway}
  template:
    metadata:
      labels: {app.kubernetes.io/name: mcp-gateway, app.kubernetes.io/part-of: spyglass}
    spec:
      serviceAccountName: mcp-gateway
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app.kubernetes.io/name: mcp-gateway}
      containers:
        - name: mcp-gateway
          image: registry.invalid/infinite-ocean/spyglass-engine:release-placeholder
          args: [mcp-gateway]
          ports: [{name: http, containerPort: 8080}]
          env:
            - {name: SPYGLASS_HTTP_ADDRESS, value: ":8080"}
            - {name: SPYGLASS_DIRECTORY_CACHE_TTL, value: "30s"}
            - {name: SPYGLASS_DIRECTORY_CACHE_CAPACITY, value: "10000"}
            - {name: SPYGLASS_ACCOUNT_EXPORT_DOWNLOAD_CAPABILITY_LIFETIME, value: "2m"}
            - {name: SPYGLASS_WORKLOAD_CERT_FILE, value: "/var/run/secrets/spyglass/workload/tls.crt"}
            - {name: SPYGLASS_WORKLOAD_KEY_FILE, value: "/var/run/secrets/spyglass/workload/tls.key"}
            - {name: SPYGLASS_WORKLOAD_CA_FILE, value: "/var/run/secrets/spyglass/workload/ca.crt"}
          envFrom:
            - configMapRef: {name: spyglass-global-runtime}
            - secretRef: {name: spyglass-mcp-gateway-secrets}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          volumeMounts:
            - {name: workload-tls, mountPath: /var/run/secrets/spyglass/workload, readOnly: true}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: {drop: [ALL]}
            seccompProfile: {type: RuntimeDefault}
          readinessProbe: {httpGet: {path: /health/ready, port: http}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /health/live, port: http}, periodSeconds: 15}
      volumes:
        - name: workload-tls
          secret: {secretName: spyglass-mcp-gateway-workload-tls}
---
apiVersion: v1
kind: Service
metadata: {name: mcp-gateway, namespace: spyglass-reference}
spec:
  selector: {app.kubernetes.io/name: mcp-gateway}
  ports: [{name: http, port: 80, targetPort: http}]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: mcp-gateway, namespace: spyglass-reference}
spec:
  minAvailable: 1
  selector:
    matchLabels: {app.kubernetes.io/name: mcp-gateway}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: mcp-gateway, namespace: spyglass-reference}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: mcp-gateway}
  minReplicas: 2
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 60}
