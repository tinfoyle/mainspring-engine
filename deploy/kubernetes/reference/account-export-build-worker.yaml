apiVersion: apps/v1
kind: Deployment
metadata: {name: account-export-build-worker-cell-reference, namespace: spyglass-reference}
spec:
  replicas: 2
  selector:
    matchLabels: {app.kubernetes.io/name: account-export-build-worker, spyglass.io/cell: reference}
  template:
    metadata:
      labels: {app.kubernetes.io/name: account-export-build-worker, app.kubernetes.io/part-of: spyglass, spyglass.io/cell: reference}
    spec:
      serviceAccountName: account-export-build-worker
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app.kubernetes.io/name: account-export-build-worker, spyglass.io/cell: reference}
      containers:
        - name: worker
          image: registry.invalid/infinite-ocean/spyglass-engine:release-placeholder
          args: [account-export-build-worker]
          ports: [{name: health, containerPort: 8081}]
          env:
            - {name: SPYGLASS_CELL_ID, value: "reference"}
            - {name: SPYGLASS_HEALTH_ADDRESS, value: ":8081"}
            - {name: SPYGLASS_ACCOUNT_EXPORT_STAGING_ROOT, value: /var/lib/spyglass/account-export}
            - {name: SPYGLASS_ACCOUNT_EXPORT_POLL_INTERVAL, value: "1s"}
            - {name: SPYGLASS_ACCOUNT_EXPORT_BUILD_LEASE, value: "20m"}
            - {name: SPYGLASS_ACCOUNT_EXPORT_RETRY_DELAY, value: "5m"}
            - {name: SPYGLASS_GLOBAL_MAX_DATABASE_CONNS, value: "3"}
            - {name: SPYGLASS_CELL_MAX_DATABASE_CONNS, value: "2"}
          envFrom:
            - configMapRef: {name: spyglass-account-export-build-worker-cell-reference-runtime}
            - secretRef: {name: spyglass-account-export-build-worker-cell-reference-secrets}
          resources:
            requests: {cpu: 100m, memory: 192Mi, ephemeral-storage: 1Gi}
            limits: {cpu: "2", memory: 1Gi, ephemeral-storage: 34Gi}
          volumeMounts:
            - {name: staging, mountPath: /var/lib/spyglass}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: {drop: [ALL]}
            seccompProfile: {type: RuntimeDefault}
          readinessProbe: {httpGet: {path: /health/ready, port: health}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /health/live, port: health}, periodSeconds: 15}
      volumes:
        - name: staging
          emptyDir: {sizeLimit: 34Gi}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: account-export-build-worker-cell-reference, namespace: spyglass-reference}
spec:
  minAvailable: 1
  selector:
    matchLabels: {app.kubernetes.io/name: account-export-build-worker, spyglass.io/cell: reference}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: account-export-build-worker-cell-reference, namespace: spyglass-reference}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: account-export-build-worker-cell-reference}
  minReplicas: 2
  maxReplicas: 4
  behavior:
    scaleDown: {stabilizationWindowSeconds: 600}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 65}
