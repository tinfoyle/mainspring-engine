apiVersion: apps/v1
kind: Deployment
metadata: {name: schedule-execution-worker-cell-reference, namespace: spyglass-reference}
spec:
  replicas: 2
  selector:
    matchLabels: {app.kubernetes.io/name: schedule-execution-worker, spyglass.io/cell: reference}
  template:
    metadata:
      labels: {app.kubernetes.io/name: schedule-execution-worker, app.kubernetes.io/part-of: spyglass, spyglass.io/cell: reference}
    spec:
      serviceAccountName: schedule-execution-worker
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app.kubernetes.io/name: schedule-execution-worker, spyglass.io/cell: reference}
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app.kubernetes.io/name: schedule-execution-worker, spyglass.io/cell: reference}
      containers:
        - name: worker
          image: registry.invalid/infinite-ocean/spyglass-engine:release-placeholder
          args: [schedule-execution-worker]
          ports: [{name: health, containerPort: 8081}]
          env:
            - {name: SPYGLASS_HEALTH_ADDRESS, value: ":8081"}
            - {name: SPYGLASS_CELL_MAX_DATABASE_CONNS, value: "3"}
            - {name: SPYGLASS_SCHEDULE_EXECUTION_POLL_INTERVAL, value: "1s"}
            - {name: SPYGLASS_SCHEDULE_EXECUTION_LEASE, value: "30s"}
            - {name: SPYGLASS_SCHEDULE_EXECUTION_MAX_ATTEMPTS, value: "12"}
            - {name: SPYGLASS_WORK_ADMISSION_ORIGIN, value: "https://admission-api.spyglass-reference.svc.cluster.local"}
            - {name: SPYGLASS_CELL_EXECUTION_ORIGIN, value: "https://app-api-cell-reference.spyglass-reference.svc.cluster.local"}
            - {name: SPYGLASS_WORKLOAD_CERT_FILE, value: "/var/run/secrets/spyglass/workload/tls.crt"}
            - {name: SPYGLASS_WORKLOAD_KEY_FILE, value: "/var/run/secrets/spyglass/workload/tls.key"}
            - {name: SPYGLASS_WORKLOAD_CA_FILE, value: "/var/run/secrets/spyglass/workload/ca.crt"}
          envFrom:
            - configMapRef: {name: spyglass-cell-reference-runtime}
            - secretRef: {name: spyglass-schedule-execution-worker-cell-reference-secrets}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: "500m", memory: 256Mi}
          volumeMounts:
            - {name: workload-tls, mountPath: /var/run/secrets/spyglass/workload, readOnly: true}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: {drop: [ALL]}
            seccompProfile: {type: RuntimeDefault}
          readinessProbe: {httpGet: {path: /health/ready, port: health}, periodSeconds: 5}
          startupProbe: {httpGet: {path: /health/live, port: health}, periodSeconds: 2, failureThreshold: 30}
          livenessProbe: {httpGet: {path: /health/live, port: health}, periodSeconds: 15}
      volumes:
        - name: workload-tls
          secret: {secretName: spyglass-schedule-execution-worker-cell-reference-workload-tls}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: schedule-execution-worker-cell-reference, namespace: spyglass-reference}
spec:
  minAvailable: 1
  selector:
    matchLabels: {app.kubernetes.io/name: schedule-execution-worker, spyglass.io/cell: reference}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: schedule-execution-worker-cell-reference, namespace: spyglass-reference}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: schedule-execution-worker-cell-reference}
  minReplicas: 2
  maxReplicas: 10
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies: [{type: Percent, value: 100, periodSeconds: 30}, {type: Pods, value: 2, periodSeconds: 30}]
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 65}
    - type: External
      external:
        metric: {name: spyglass_schedule_execution_ready}
        target: {type: AverageValue, averageValue: "5"}
