  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: admission-api}
      ports: [{protocol: TCP, port: 8080}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: admission-api-from-cell-api, namespace: spyglass-reference}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: admission-api}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - {key: app.kubernetes.io/name, operator: In, values: [app-api, agent-dispatch-worker, schedule-execution-worker]}
      ports: [{protocol: TCP, port: 8080}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: runner-to-broker, namespace: spyglass-runners-reference}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: spyglass-runner}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: spyglass-reference}
          podSelector:
            matchLabels: {app.kubernetes.io/name: runner-broker}
      ports: [{protocol: TCP, port: 8443}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: broker-from-runner, namespace: spyglass-reference}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: runner-broker}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: spyglass-runners-reference}
          podSelector:
            matchLabels: {app.kubernetes.io/name: spyglass-runner}
      ports: [{protocol: TCP, port: 8443}]
---
