apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: spyglass-reference
  labels: {app.kubernetes.io/name: otel-collector, app.kubernetes.io/part-of: spyglass, app.kubernetes.io/component: observability}
spec:
  replicas: 2
  minReadySeconds: 5
  progressDeadlineSeconds: 600
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app.kubernetes.io/name: otel-collector}
  template:
    metadata:
      labels: {app.kubernetes.io/name: otel-collector, app.kubernetes.io/part-of: spyglass, app.kubernetes.io/component: observability}
    spec:
      serviceAccountName: otel-collector
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
        - maxSkew: 1
          minDomains: 2
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels: {app.kubernetes.io/name: otel-collector}
      containers:
        - name: collector
          image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.159.0@sha256:1f2c54a30e713fac6b3ae77a1ec84010c2007e29ced8ec666214fc2f6739c1cc
          args: ["--config=/etc/spyglass-otel/collector.yaml"]
          env:
            - name: SPYGLASS_ENVIRONMENT
              valueFrom:
                configMapKeyRef: {name: spyglass-observability-runtime, key: environment}
            - name: SPYGLASS_OTEL_BACKEND_ENDPOINT
              valueFrom:
                configMapKeyRef: {name: spyglass-observability-runtime, key: backendEndpoint}
            - name: SPYGLASS_OTEL_BACKEND_AUTHORIZATION
              valueFrom:
                secretKeyRef: {name: spyglass-otel-collector-backend, key: authorization}
          ports:
            - {name: otlp-http, containerPort: 4318}
            - {name: metrics, containerPort: 8888}
            - {name: health, containerPort: 13133}
          resources:
            requests: {cpu: 150m, memory: 256Mi}
            limits: {cpu: "1", memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities: {drop: [ALL]}
            seccompProfile: {type: RuntimeDefault}
          readinessProbe: {httpGet: {path: /health, port: health}, periodSeconds: 5, failureThreshold: 3}
          startupProbe: {httpGet: {path: /health, port: health}, periodSeconds: 2, failureThreshold: 30}
          livenessProbe: {httpGet: {path: /health, port: health}, periodSeconds: 15, failureThreshold: 3}
          volumeMounts:
            - {name: config, mountPath: /etc/spyglass-otel, readOnly: true}
            - {name: ingress-tls, mountPath: /var/run/secrets/spyglass/collector-ingress, readOnly: true}
            - {name: workload-client-ca, mountPath: /var/run/secrets/spyglass/workload-client-ca, readOnly: true}
            - {name: backend, mountPath: /var/run/secrets/spyglass/collector-backend, readOnly: true}
      volumes:
        - name: config
          configMap: {name: spyglass-otel-collector-config}
        - name: ingress-tls
          secret: {secretName: spyglass-otel-collector-ingress-tls}
        - name: workload-client-ca
          configMap: {name: spyglass-workload-client-ca}
        - name: backend
          secret: {secretName: spyglass-otel-collector-backend}
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: spyglass-reference
  labels: {app.kubernetes.io/name: otel-collector, app.kubernetes.io/part-of: spyglass, app.kubernetes.io/component: observability}
spec:
  selector: {app.kubernetes.io/name: otel-collector}
  ports:
    - {name: otlp-http, port: 4318, targetPort: otlp-http}
    - {name: metrics, port: 8888, targetPort: metrics}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: otel-collector, namespace: spyglass-reference}
spec:
  minAvailable: 1
  selector:
    matchLabels: {app.kubernetes.io/name: otel-collector}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: otel-collector, namespace: spyglass-reference}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: otel-collector}
  minReplicas: 2
  maxReplicas: 10
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies: [{type: Percent, value: 100, periodSeconds: 30}, {type: Pods, value: 2, periodSeconds: 30}]
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 65}
