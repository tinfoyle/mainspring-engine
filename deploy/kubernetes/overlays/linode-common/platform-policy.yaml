apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: public-ingress, namespace: spyglass-reference}
spec:
  podSelector:
    matchExpressions:
      - {key: app.kubernetes.io/name, operator: In, values: [infinite-ocean-website, account-api, app-router]}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: ingress-nginx}
          podSelector:
            matchLabels: {app.kubernetes.io/name: ingress-nginx}
      ports:
        - {protocol: TCP, port: 3000}
        - {protocol: TCP, port: 8080}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: website-to-account-api, namespace: spyglass-reference}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: infinite-ocean-website}
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: account-api}
      ports: [{protocol: TCP, port: 8080}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: account-api-from-website, namespace: spyglass-reference}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: account-api}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: infinite-ocean-website}
      ports: [{protocol: TCP, port: 8080}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: global-workloads-to-postgres, namespace: spyglass-reference}
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - account-api
          - account-lifecycle-worker
          - admission-api
          - app-router
          - tool-router
          - billing-worker
          - entitlement-worker
          - identity-maintenance-worker
          - notification-worker
          - work-reconciler
          - baseline-maintenance-worker
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels: {cnpg.io/cluster: spyglass-global-postgres}
      ports: [{protocol: TCP, port: 5432}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: global-postgres-from-workloads, namespace: spyglass-reference}
spec:
  podSelector:
    matchLabels: {cnpg.io/cluster: spyglass-global-postgres}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - account-api
                  - account-lifecycle-worker
                  - admission-api
                  - app-router
                  - tool-router
                  - billing-worker
                  - entitlement-worker
                  - identity-maintenance-worker
                  - notification-worker
                  - work-reconciler
                  - baseline-maintenance-worker
                  - spyglass-prototype-migration
      ports: [{protocol: TCP, port: 5432}]
    - from:
        - podSelector:
            matchLabels: {spyglass.io/database-target: global}
      ports: [{protocol: TCP, port: 5432}]
---
