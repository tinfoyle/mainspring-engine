---
apiVersion: apps/v1
kind: Deployment
metadata: {name: infinite-ocean-website, namespace: spyglass-reference}
spec:
  replicas: 2
  selector: {matchLabels: {app.kubernetes.io/name: infinite-ocean-website}}
  template:
    metadata: {labels: {app.kubernetes.io/name: infinite-ocean-website, app.kubernetes.io/part-of: spyglass}}
    spec:
      serviceAccountName: website
      automountServiceAccountToken: false
      enableServiceLinks: false
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app.kubernetes.io/name: infinite-ocean-website}
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app.kubernetes.io/name: infinite-ocean-website}
      containers:
        - name: website
          image: registry.invalid/infinite-ocean/infinite-ocean-website:release-placeholder
          ports: [{name: http, containerPort: 3000}]
          envFrom: [{configMapRef: {name: spyglass-website-runtime}}]
          readinessProbe: {httpGet: {path: /health/ready, port: http}}
          livenessProbe: {httpGet: {path: /health/live, port: http}}
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {cpu: 500m, memory: 384Mi}
          volumeMounts:
            - {name: next-cache, mountPath: /app/.next/cache}
            - {name: tmp, mountPath: /tmp}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: {drop: [ALL]}
            seccompProfile: {type: RuntimeDefault}
      volumes:
        - {name: next-cache, emptyDir: {sizeLimit: 256Mi}}
        - {name: tmp, emptyDir: {medium: Memory, sizeLimit: 64Mi}}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: website, namespace: spyglass-reference}
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata: {name: infinite-ocean-website, namespace: spyglass-reference}
spec:
  selector: {app.kubernetes.io/name: infinite-ocean-website}
  ports: [{name: http, port: 80, targetPort: http}]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: infinite-ocean-website, namespace: spyglass-reference}
spec:
  minAvailable: 1
  selector:
    matchLabels: {app.kubernetes.io/name: infinite-ocean-website}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: infinite-ocean-website, namespace: spyglass-reference}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: infinite-ocean-website}
  minReplicas: 2
  maxReplicas: 10
  behavior:
    scaleDown: {stabilizationWindowSeconds: 300}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 60}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata: {name: spyglass-public, namespace: spyglass-reference}
spec:
  secretName: spyglass-public-tls
  issuerRef: {kind: ClusterIssuer, name: letsencrypt-production}
  dnsNames: [stage.invalid, app.stage.invalid]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: spyglass-public
  namespace: spyglass-reference
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
    nginx.ingress.kubernetes.io/proxy-body-size: 1m
spec:
  ingressClassName: nginx
  tls: [{hosts: [stage.invalid, app.stage.invalid], secretName: spyglass-public-tls}]
  rules:
    - host: stage.invalid
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: {service: {name: infinite-ocean-website, port: {name: http}}}
    - host: app.stage.invalid
      http:
        paths:
          - path: /api/v1/accounts
            pathType: Prefix
            backend: {service: {name: app-router, port: {name: http}}}
          - path: /
            pathType: Prefix
            backend: {service: {name: account-api, port: {name: http}}}
