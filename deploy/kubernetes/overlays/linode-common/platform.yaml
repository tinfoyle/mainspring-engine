apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata: {name: spyglass-global-postgres, namespace: spyglass-reference}
spec:
  instances: 2
  primaryUpdateStrategy: unsupervised
  affinity: {enablePodAntiAffinity: true, podAntiAffinityType: preferred, topologyKey: kubernetes.io/hostname}
  postgresql:
    parameters: {max_connections: "200"}
  storage: {size: 40Gi, storageClass: spyglass-lke-block-storage}
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {cpu: "2", memory: 2Gi}
  monitoring: {enablePodMonitor: true}
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata: {name: spyglass-cell-a-postgres, namespace: spyglass-reference}
spec:
  instances: 2
  primaryUpdateStrategy: unsupervised
  affinity: {enablePodAntiAffinity: true, podAntiAffinityType: preferred, topologyKey: kubernetes.io/hostname}
