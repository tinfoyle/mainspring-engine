apiVersion: v1
kind: ServiceAccount
metadata: {name: deployment-operator, namespace: spyglass-reference}
automountServiceAccountToken: false
---
apiVersion: batch/v1
kind: Job
metadata:
  name: spyglass-global-migration
  namespace: spyglass-reference
  labels: {app.kubernetes.io/name: spyglass-migration, app.kubernetes.io/part-of: spyglass, spyglass.io/database-target: global}
spec:
  suspend: true
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels: {app.kubernetes.io/name: spyglass-migration, app.kubernetes.io/part-of: spyglass, spyglass.io/database-target: global}
    spec:
      serviceAccountName: deployment-operator
      automountServiceAccountToken: false
      enableServiceLinks: false
      restartPolicy: Never
      containers:
        - name: migrate
          image: registry.invalid/infinite-ocean/spyglass-engine:release-placeholder
          args: [migrate]
          env: [{name: SPYGLASS_MIGRATION_TARGET, value: global}]
          envFrom: [{secretRef: {name: spyglass-global-migration-secrets}}]
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: "1", memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: {drop: [ALL]}
            seccompProfile: {type: RuntimeDefault}
---
