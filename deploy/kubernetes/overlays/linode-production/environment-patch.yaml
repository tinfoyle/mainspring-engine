apiVersion: v1
kind: Namespace
metadata:
  name: spyglass-reference
  annotations:
    spyglass.io/environment-namespace: spyglass-production
    spyglass.io/admission-origin: https://admission-api.spyglass-production.svc.cluster.local
    spyglass.io/broker-a-origin: https://runner-broker-cell-a.spyglass-production.svc.cluster.local
    spyglass.io/broker-b-origin: https://runner-broker-cell-b.spyglass-production.svc.cluster.local
    spyglass.io/tool-origin: https://tool-router.spyglass-production.svc.cluster.local
    spyglass.io/model-origin: https://model-gateway.spyglass-production.svc.cluster.local
---
apiVersion: v1
kind: Namespace
metadata:
  name: spyglass-runners-reference
  annotations: {spyglass.io/environment-namespace: spyglass-runners-production}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata: {name: spyglass-public, namespace: spyglass-reference}
spec:
  dnsNames: [www.infiniteocean.net, app.infiniteocean.net, mcp.infiniteocean.net]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: spyglass-public, namespace: spyglass-reference}
spec:
  tls: [{hosts: [www.infiniteocean.net, app.infiniteocean.net, mcp.infiniteocean.net], secretName: spyglass-public-tls}]
  rules:
    - host: www.infiniteocean.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: {service: {name: infinite-ocean-website, port: {name: http}}}
    - host: app.infiniteocean.net
      http:
        paths:
          - path: /api/v1/accounts
            pathType: Prefix
            backend: {service: {name: app-router, port: {name: http}}}
          - path: /
            pathType: Prefix
            backend: {service: {name: account-api, port: {name: http}}}
    - host: mcp.infiniteocean.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: {service: {name: mcp-gateway, port: {name: http}}}
