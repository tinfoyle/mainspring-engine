apiVersion: cert-manager.io/v1
kind: Certificate
metadata: {name: spyglass-public, namespace: spyglass-reference}
spec:
  dnsNames: [preproduction.infiniteocean.net, app.preproduction.infiniteocean.net]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: spyglass-public, namespace: spyglass-reference}
spec:
  tls: [{hosts: [preproduction.infiniteocean.net, app.preproduction.infiniteocean.net], secretName: spyglass-public-tls}]
  rules:
    - host: preproduction.infiniteocean.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: {service: {name: infinite-ocean-website, port: {name: http}}}
    - host: app.preproduction.infiniteocean.net
      http:
        paths:
          - path: /api/v1/accounts
            pathType: Prefix
            backend: {service: {name: app-router, port: {name: http}}}
          - path: /
            pathType: Prefix
            backend: {service: {name: account-api, port: {name: http}}}
