      SPYGLASS_DATABASE_URL: ${SPYGLASS_IDENTITY_MAINTENANCE_WORKER_DATABASE_URL:?set SPYGLASS_IDENTITY_MAINTENANCE_WORKER_DATABASE_URL}
      SPYGLASS_IDENTITY_MAINTENANCE_INTERVAL: ${SPYGLASS_IDENTITY_MAINTENANCE_INTERVAL:-1h}
      SPYGLASS_PASSKEY_CEREMONY_RETENTION: ${SPYGLASS_PASSKEY_CEREMONY_RETENTION:-24h}
