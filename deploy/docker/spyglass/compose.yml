    command: [notification-worker]
    environment:
      SPYGLASS_ENV: ${SPYGLASS_PROCESS_ENV:?set SPYGLASS_PROCESS_ENV}
      SPYGLASS_ENVIRONMENT: ${SPYGLASS_ENVIRONMENT:?set SPYGLASS_ENVIRONMENT}
      SPYGLASS_DATABASE_URL: ${SPYGLASS_NOTIFICATION_WORKER_DATABASE_URL:?set SPYGLASS_NOTIFICATION_WORKER_DATABASE_URL}
      SPYGLASS_NOTIFICATION_ENCRYPTION_KEY: ${SPYGLASS_NOTIFICATION_ENCRYPTION_KEY:?set SPYGLASS_NOTIFICATION_ENCRYPTION_KEY}
      SPYGLASS_SMTP_ADDRESS: ${SPYGLASS_SMTP_ADDRESS:?set SPYGLASS_SMTP_ADDRESS}
      SPYGLASS_SMTP_SERVER_NAME: ${SPYGLASS_SMTP_SERVER_NAME:?set SPYGLASS_SMTP_SERVER_NAME}
      SPYGLASS_SMTP_USERNAME: ${SPYGLASS_SMTP_USERNAME:-}
      SPYGLASS_SMTP_PASSWORD: ${SPYGLASS_SMTP_PASSWORD:-}
      SPYGLASS_SMTP_FROM_ADDRESS: ${SPYGLASS_SMTP_FROM_ADDRESS:?set SPYGLASS_SMTP_FROM_ADDRESS}
      SPYGLASS_SMTP_FROM_NAME: ${SPYGLASS_SMTP_FROM_NAME:-Infinite Ocean}
      SPYGLASS_SMTP_ROOT_CA_FILE: ${SPYGLASS_SMTP_ROOT_CA_FILE:-}
      SPYGLASS_APP_ORIGIN: ${SPYGLASS_APP_ORIGIN:?set SPYGLASS_APP_ORIGIN}
      SPYGLASS_HEALTH_ADDRESS: :8081
    depends_on:
      global-seed: {condition: service_completed_successfully}
    networks: [application, database]

  entitlement-worker:
