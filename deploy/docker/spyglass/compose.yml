      retries: 20
      start_period: 10s
    depends_on:
      cell-b-migrate: {condition: service_completed_successfully}
      admission-api: {condition: service_healthy}
    networks:
      - application
      - database

  app-router:
    <<: *application
    command: [app-router]
    environment:
      SPYGLASS_ENV: ${SPYGLASS_PROCESS_ENV:?set SPYGLASS_PROCESS_ENV}
      SPYGLASS_ENVIRONMENT: ${SPYGLASS_ENVIRONMENT:?set SPYGLASS_ENVIRONMENT}
      SPYGLASS_HTTP_ADDRESS: :8080
      SPYGLASS_DATABASE_URL: ${SPYGLASS_APP_ROUTER_DATABASE_URL:?set SPYGLASS_APP_ROUTER_DATABASE_URL}
      SPYGLASS_ROUTE_ISSUER: ${SPYGLASS_ROUTE_ISSUER:?set SPYGLASS_ROUTE_ISSUER}
      SPYGLASS_ROUTE_SIGNING_KEY_ID: ${SPYGLASS_ROUTE_SIGNING_KEY_ID:?set SPYGLASS_ROUTE_SIGNING_KEY_ID}
      SPYGLASS_ROUTE_SIGNING_KEY: ${SPYGLASS_ROUTE_SIGNING_KEY:?set SPYGLASS_ROUTE_SIGNING_KEY}
      SPYGLASS_TOOL_CONTEXT_ISSUER: ${SPYGLASS_TOOL_CONTEXT_ISSUER:?set SPYGLASS_TOOL_CONTEXT_ISSUER}
      SPYGLASS_TOOL_CONTEXT_VERIFY_KEYS: ${SPYGLASS_TOOL_CONTEXT_VERIFY_KEYS:?set SPYGLASS_TOOL_CONTEXT_VERIFY_KEYS}
      SPYGLASS_APP_ORIGIN: ${SPYGLASS_APP_ORIGIN:?set SPYGLASS_APP_ORIGIN}
      SPYGLASS_DIRECTORY_CACHE_TTL: 5s
      SPYGLASS_DIRECTORY_CACHE_CAPACITY: "1000"
    expose: ["8080"]
    healthcheck:
      test: [CMD, /spyglass, healthcheck, --url=http://127.0.0.1:8080/health/ready]
      interval: 5s
      timeout: 4s
      retries: 20
      start_period: 10s
    depends_on:
      global-seed: {condition: service_completed_successfully}
      app-api-a: {condition: service_healthy}
      app-api-b: {condition: service_healthy}
    networks:
      - application
      - database

  billing-worker:
    <<: *worker
    command: [billing-worker]
    environment:
      SPYGLASS_ENV: ${SPYGLASS_PROCESS_ENV:?set SPYGLASS_PROCESS_ENV}
      SPYGLASS_ENVIRONMENT: ${SPYGLASS_ENVIRONMENT:?set SPYGLASS_ENVIRONMENT}
      SPYGLASS_DATABASE_URL: ${SPYGLASS_BILLING_WORKER_DATABASE_URL:?set SPYGLASS_BILLING_WORKER_DATABASE_URL}
      SPYGLASS_STRIPE_SECRET_KEY: ${SPYGLASS_STRIPE_SECRET_KEY:?set SPYGLASS_STRIPE_SECRET_KEY}
      SPYGLASS_STRIPE_MODE: ${SPYGLASS_STRIPE_MODE:?set SPYGLASS_STRIPE_MODE}
      SPYGLASS_HEALTH_ADDRESS: :8081
    depends_on:
      global-seed: {condition: service_completed_successfully}
    networks: [application, database]

  notification-worker:
