      SPYGLASS_GLOBAL_DATABASE_URL: ${SPYGLASS_WORK_RECONCILER_GLOBAL_DATABASE_URL:?set SPYGLASS_WORK_RECONCILER_GLOBAL_DATABASE_URL}
