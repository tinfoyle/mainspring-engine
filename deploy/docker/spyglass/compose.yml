x-application: &application
  image: ${SPYGLASS_APPLICATION_IMAGE:-spyglass-application:local}
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:size=16m,mode=1777
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  networks:
    - application

x-postgres: &postgres
  image: postgres:17.11-alpine3.24@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
  restart: unless-stopped
  shm_size: 256mb
  networks:
    - database

x-worker: &worker
  <<: *application
  expose: ["8081"]
  healthcheck:
    test: [CMD, /spyglass, healthcheck, --url=http://127.0.0.1:8081/health/ready]
    interval: 5s
    timeout: 4s
    retries: 20
    start_period: 10s

services:
  edge:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    restart: unless-stopped
    depends_on:
      account-api: {condition: service_healthy}
      app-router: {condition: service_healthy}
      mcp-gateway: {condition: service_healthy}
      website: {condition: service_healthy}
      private-ui: {condition: service_healthy}
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - edge
      - application

  website:
    image: ${SPYGLASS_WEBSITE_IMAGE:-infinite-ocean-public-ui:local}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    environment:
      SPYGLASS_ACCOUNT_API_ORIGIN: http://account-api:8080
      SPYGLASS_APP_ORIGIN: ${SPYGLASS_APP_ORIGIN:?set SPYGLASS_APP_ORIGIN}
      SPYGLASS_ENVIRONMENT: ${SPYGLASS_ENVIRONMENT:?set SPYGLASS_ENVIRONMENT}
      NUXT_PUBLIC_APP_ORIGIN: ${SPYGLASS_APP_ORIGIN:?set SPYGLASS_APP_ORIGIN}
    expose: ["3000"]
    networks:
      - application

  private-ui:
    image: ${SPYGLASS_PRIVATE_UI_IMAGE:-infinite-ocean-private-ui:local}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /config:size=4m,mode=700
      - /data:size=4m,mode=700
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    expose: ["8080"]
    networks:
      - application

  global-db:
    <<: *postgres
    environment:
      POSTGRES_DB: spyglass
      POSTGRES_USER: spyglass_migrator
      POSTGRES_PASSWORD: ${SPYGLASS_GLOBAL_DATABASE_PASSWORD:?set SPYGLASS_GLOBAL_DATABASE_PASSWORD}
    volumes:
      - global-db:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U spyglass_migrator -d spyglass"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  cell-a-db:
    <<: *postgres
    environment:
      POSTGRES_DB: spyglass
      POSTGRES_USER: spyglass_migrator
      POSTGRES_PASSWORD: ${SPYGLASS_CELL_A_DATABASE_PASSWORD:?set SPYGLASS_CELL_A_DATABASE_PASSWORD}
    volumes:
      - cell-a-db:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U spyglass_migrator -d spyglass"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  cell-b-db:
    <<: *postgres
    environment:
      POSTGRES_DB: spyglass
      POSTGRES_USER: spyglass_migrator
      POSTGRES_PASSWORD: ${SPYGLASS_CELL_B_DATABASE_PASSWORD:?set SPYGLASS_CELL_B_DATABASE_PASSWORD}
    volumes:
      - cell-b-db:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U spyglass_migrator -d spyglass"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  object-store:
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    restart: unless-stopped
    command: [server, /data]
    environment:
      MINIO_ROOT_USER: ${SPYGLASS_OBJECT_STORE_ACCESS_KEY:?set SPYGLASS_OBJECT_STORE_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${SPYGLASS_OBJECT_STORE_SECRET_KEY:?set SPYGLASS_OBJECT_STORE_SECRET_KEY}
      MINIO_KMS_SECRET_KEY: ${SPYGLASS_OBJECT_STORE_KMS_SECRET_KEY:?set SPYGLASS_OBJECT_STORE_KMS_SECRET_KEY}
    volumes:
      - object-store:/data
    expose: ["9000"]
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://127.0.0.1:9000/minio/health/ready]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    networks: [application]

  object-store-init:
    image: minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    restart: "no"
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        mc alias set spyglass http://object-store:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing spyglass/$${SPYGLASS_OBJECT_STORE_BUCKET}
        mc version enable spyglass/$${SPYGLASS_OBJECT_STORE_BUCKET}
        mc mb --ignore-existing spyglass/$${SPYGLASS_ACCOUNT_EXPORT_OBJECT_STORE_BUCKET}
        mc version enable spyglass/$${SPYGLASS_ACCOUNT_EXPORT_OBJECT_STORE_BUCKET}
        mc admin policy create spyglass spyglass-app-api /etc/spyglass/minio/app-api-policy.json
        mc admin policy create spyglass spyglass-document-worker /etc/spyglass/minio/document-worker-policy.json
        mc admin policy create spyglass spyglass-integration-connector /etc/spyglass/minio/integration-connector-policy.json
        mc admin policy create spyglass spyglass-prototype-migration /etc/spyglass/minio/prototype-migration-policy.json
        mc admin policy create spyglass spyglass-account-export-source-reader /etc/spyglass/minio/account-export-source-reader-policy.json
        mc admin policy create spyglass spyglass-account-export-build /etc/spyglass/minio/account-export-build-policy.json
        mc admin policy create spyglass spyglass-account-export-expiry /etc/spyglass/minio/account-export-expiry-policy.json
        mc admin policy create spyglass spyglass-account-export-download /etc/spyglass/minio/account-export-download-policy.json
        mc admin user add spyglass "$${SPYGLASS_OBJECT_STORE_APP_ACCESS_KEY}" "$${SPYGLASS_OBJECT_STORE_APP_SECRET_KEY}"
        mc admin user add spyglass "$${SPYGLASS_OBJECT_STORE_WORKER_ACCESS_KEY}" "$${SPYGLASS_OBJECT_STORE_WORKER_SECRET_KEY}"
        mc admin user add spyglass "$${SPYGLASS_OBJECT_STORE_CONNECTOR_ACCESS_KEY}" "$${SPYGLASS_OBJECT_STORE_CONNECTOR_SECRET_KEY}"
        mc admin user add spyglass "$${SPYGLASS_OBJECT_STORE_MIGRATION_ACCESS_KEY}" "$${SPYGLASS_OBJECT_STORE_MIGRATION_SECRET_KEY}"
        mc admin user add spyglass "$${SPYGLASS_ACCOUNT_EXPORT_SOURCE_OBJECT_STORE_ACCESS_KEY}" "$${SPYGLASS_ACCOUNT_EXPORT_SOURCE_OBJECT_STORE_SECRET_KEY}"
        mc admin user add spyglass "$${SPYGLASS_ACCOUNT_EXPORT_OBJECT_STORE_BUILD_ACCESS_KEY}" "$${SPYGLASS_ACCOUNT_EXPORT_OBJECT_STORE_BUILD_SECRET_KEY}"
        mc admin user add spyglass "$${SPYGLASS_ACCOUNT_EXPORT_OBJECT_STORE_EXPIRY_ACCESS_KEY}" "$${SPYGLASS_ACCOUNT_EXPORT_OBJECT_STORE_EXPIRY_SECRET_KEY}"
        mc admin user add spyglass "$${SPYGLASS_ACCOUNT_EXPORT_OBJECT_STORE_DOWNLOAD_ACCESS_KEY}" "$${SPYGLASS_ACCOUNT_EXPORT_OBJECT_STORE_DOWNLOAD_SECRET_KEY}"
        mc admin policy attach spyglass spyglass-app-api --user "$${SPYGLASS_OBJECT_STORE_APP_ACCESS_KEY}"
        mc admin policy attach spyglass spyglass-document-worker --user "$${SPYGLASS_OBJECT_STORE_WORKER_ACCESS_KEY}"
        mc admin policy attach spyglass spyglass-integration-connector --user "$${SPYGLASS_OBJECT_STORE_CONNECTOR_ACCESS_KEY}"
        mc admin policy attach spyglass spyglass-prototype-migration --user "$${SPYGLASS_OBJECT_STORE_MIGRATION_ACCESS_KEY}"
        mc admin policy attach spyglass spyglass-account-export-source-reader --user "$${SPYGLASS_ACCOUNT_EXPORT_SOURCE_OBJECT_STORE_ACCESS_KEY}"
        mc admin policy attach spyglass spyglass-account-export-build --user "$${SPYGLASS_ACCOUNT_EXPORT_OBJECT_STORE_BUILD_ACCESS_KEY}"
        mc admin policy attach spyglass spyglass-account-export-expiry --user "$${SPYGLASS_ACCOUNT_EXPORT_OBJECT_STORE_EXPIRY_ACCESS_KEY}"
        mc admin policy attach spyglass spyglass-account-export-download --user "$${SPYGLASS_ACCOUNT_EXPORT_OBJECT_STORE_DOWNLOAD_ACCESS_KEY}"
    environment:
      MINIO_ROOT_USER: ${SPYGLASS_OBJECT_STORE_ACCESS_KEY:?set SPYGLASS_OBJECT_STORE_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${SPYGLASS_OBJECT_STORE_SECRET_KEY:?set SPYGLASS_OBJECT_STORE_SECRET_KEY}
      SPYGLASS_OBJECT_STORE_BUCKET: ${SPYGLASS_OBJECT_STORE_BUCKET:?set SPYGLASS_OBJECT_STORE_BUCKET}
      SPYGLASS_ACCOUNT_EXPORT_OBJECT_STORE_BUCKET: ${SPYGLASS_ACCOUNT_EXPORT_OBJECT_STORE_BUCKET:?set SPYGLASS_ACCOUNT_EXPORT_OBJECT_STORE_BUCKET}
      SPYGLASS_OBJECT_STORE_APP_ACCESS_KEY: ${SPYGLASS_OBJECT_STORE_APP_ACCESS_KEY:?set SPYGLASS_OBJECT_STORE_APP_ACCESS_KEY}
      SPYGLASS_OBJECT_STORE_APP_SECRET_KEY: ${SPYGLASS_OBJECT_STORE_APP_SECRET_KEY:?set SPYGLASS_OBJECT_STORE_APP_SECRET_KEY}
      SPYGLASS_OBJECT_STORE_WORKER_ACCESS_KEY: ${SPYGLASS_OBJECT_STORE_WORKER_ACCESS_KEY:?set SPYGLASS_OBJECT_STORE_WORKER_ACCESS_KEY}
      SPYGLASS_OBJECT_STORE_WORKER_SECRET_KEY: ${SPYGLASS_OBJECT_STORE_WORKER_SECRET_KEY:?set SPYGLASS_OBJECT_STORE_WORKER_SECRET_KEY}
      SPYGLASS_OBJECT_STORE_CONNECTOR_ACCESS_KEY: ${SPYGLASS_OBJECT_STORE_CONNECTOR_ACCESS_KEY:?set SPYGLASS_OBJECT_STORE_CONNECTOR_ACCESS_KEY}
      SPYGLASS_OBJECT_STORE_CONNECTOR_SECRET_KEY: ${SPYGLASS_OBJECT_STORE_CONNECTOR_SECRET_KEY:?set SPYGLASS_OBJECT_STORE_CONNECTOR_SECRET_KEY}
      SPYGLASS_OBJECT_STORE_MIGRATION_ACCESS_KEY: ${SPYGLASS_OBJECT_STORE_MIGRATION_ACCESS_KEY:?set SPYGLASS_OBJECT_STORE_MIGRATION_ACCESS_KEY}
      SPYGLASS_OBJECT_STORE_MIGRATION_SECRET_KEY: ${SPYGLASS_OBJECT_STORE_MIGRATION_SECRET_KEY:?set SPYGLASS_OBJECT_STORE_MIGRATION_SECRET_KEY}
      SPYGLASS_ACCOUNT_EXPORT_SOURCE_OBJECT_STORE_ACCESS_KEY: ${SPYGLASS_ACCOUNT_EXPORT_SOURCE_OBJECT_STORE_ACCESS_KEY:?set SPYGLASS_ACCOUNT_EXPORT_SOURCE_OBJECT_STORE_ACCESS_KEY}
      SPYGLASS_ACCOUNT_EXPORT_SOURCE_OBJECT_STORE_SECRET_KEY: ${SPYGLASS_ACCOUNT_EXPORT_SOURCE_OBJECT_STORE_SECRET_KEY:?set SPYGLASS_ACCOUNT_EXPORT_SOURCE_OBJECT_STORE_SECRET_KEY}
      SPYGLASS_ACCOUNT_EXPORT_OBJECT_STORE_BUILD_ACCESS_KEY: ${SPYGLASS_ACCOUNT_EXPORT_OBJECT_STORE_BUILD_ACCESS_KEY:?set SPYGLASS_ACCOUNT_EXPORT_OBJECT_STORE_BUILD_ACCESS_KEY}
      SPYGLASS_ACCOUNT_EXPORT_OBJECT_STORE_BUILD_SECRET_KEY: ${SPYGLASS_ACCOUNT_EXPORT_OBJECT_STORE_BUILD_SECRET_KEY:?set SPYGLASS_ACCOUNT_EXPORT_OBJECT_STORE_BUILD_SECRET_KEY}
      SPYGLASS_ACCOUNT_EXPORT_OBJECT_STORE_EXPIRY_ACCESS_KEY: ${SPYGLASS_ACCOUNT_EXPORT_OBJECT_STORE_EXPIRY_ACCESS_KEY:?set SPYGLASS_ACCOUNT_EXPORT_OBJECT_STORE_EXPIRY_ACCESS_KEY}
      SPYGLASS_ACCOUNT_EXPORT_OBJECT_STORE_EXPIRY_SECRET_KEY: ${SPYGLASS_ACCOUNT_EXPORT_OBJECT_STORE_EXPIRY_SECRET_KEY:?set SPYGLASS_ACCOUNT_EXPORT_OBJECT_STORE_EXPIRY_SECRET_KEY}
      SPYGLASS_ACCOUNT_EXPORT_OBJECT_STORE_DOWNLOAD_ACCESS_KEY: ${SPYGLASS_ACCOUNT_EXPORT_OBJECT_STORE_DOWNLOAD_ACCESS_KEY:?set SPYGLASS_ACCOUNT_EXPORT_OBJECT_STORE_DOWNLOAD_ACCESS_KEY}
      SPYGLASS_ACCOUNT_EXPORT_OBJECT_STORE_DOWNLOAD_SECRET_KEY: ${SPYGLASS_ACCOUNT_EXPORT_OBJECT_STORE_DOWNLOAD_SECRET_KEY:?set SPYGLASS_ACCOUNT_EXPORT_OBJECT_STORE_DOWNLOAD_SECRET_KEY}
      MC_CONFIG_DIR: /tmp/.mc
    tmpfs:
      - /tmp:size=16m,mode=1777
    volumes:
      - ./minio/app-api-policy.json:/etc/spyglass/minio/app-api-policy.json:ro
      - ./minio/document-worker-policy.json:/etc/spyglass/minio/document-worker-policy.json:ro
      - ./minio/integration-connector-policy.json:/etc/spyglass/minio/integration-connector-policy.json:ro
      - ./minio/prototype-migration-policy.json:/etc/spyglass/minio/prototype-migration-policy.json:ro
      - ./minio/account-export-source-reader-policy.json:/etc/spyglass/minio/account-export-source-reader-policy.json:ro
      - ./minio/account-export-build-policy.json:/etc/spyglass/minio/account-export-build-policy.json:ro
      - ./minio/account-export-expiry-policy.json:/etc/spyglass/minio/account-export-expiry-policy.json:ro
      - ./minio/account-export-download-policy.json:/etc/spyglass/minio/account-export-download-policy.json:ro
    depends_on:
      object-store: {condition: service_healthy}
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    networks: [application]

  document-extractor:
    profiles: [test, knowledge-processing]
    image: apache/tika@sha256:2a565f1ea1290bdcb74a7d35957d16a989ed44ef98790dcdcc28121d728fa583
    restart: unless-stopped
    command: [-c, /etc/tika/tika-config.xml]
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777,uid=35002,gid=35002
    volumes:
      - ./tika/tika-config.xml:/etc/tika/tika-config.xml:ro
    expose: ["9998"]
    healthcheck:
      test: [CMD, /usr/bin/bash, -ec, "exec 3<>/dev/tcp/127.0.0.1/9998; printf 'GET /version HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3; grep -q '200 OK' <&3"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 15s
    mem_limit: 1536m
    cpus: 2.0
    pids_limit: 256
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    networks: [application]

  malware-scanner:
    profiles: [test, knowledge-processing]
    image: clamav/clamav@sha256:c3bfbf2a2c9abc1fc179e63832a9e8bfac901ede83853e3fa10acf6f1fb5c803
    restart: unless-stopped
    environment:
      CLAMAV_NO_FRESHCLAMD: ${SPYGLASS_CLAMAV_DISABLE_UPDATES:-true}
      CLAMD_CONF_StreamMaxLength: 52428800
      CLAMD_CONF_MaxFileSize: 52428800
      CLAMD_CONF_MaxScanSize: 104857600
      CLAMD_CONF_MaxScanTime: 120000
    volumes:
      - clamav-db:/var/lib/clamav
    expose: ["3310"]
    mem_limit: 4g
    cpus: 2.0
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    networks: [application]

  global-migrate:
    <<: *application
    restart: "no"
    command: [migrate]
    environment:
      SPYGLASS_DATABASE_URL: ${SPYGLASS_GLOBAL_MIGRATION_DATABASE_URL:?set SPYGLASS_GLOBAL_MIGRATION_DATABASE_URL}
      SPYGLASS_MIGRATION_TARGET: global
    depends_on:
      global-db: {condition: service_healthy}
    networks:
      - database

  cell-a-migrate:
    <<: *application
    restart: "no"
    command: [migrate]
    environment:
      SPYGLASS_DATABASE_URL: ${SPYGLASS_CELL_A_MIGRATION_DATABASE_URL:?set SPYGLASS_CELL_A_MIGRATION_DATABASE_URL}
      SPYGLASS_MIGRATION_TARGET: cell
    depends_on:
      cell-a-db: {condition: service_healthy}
    networks:
      - database

  cell-b-migrate:
    <<: *application
    restart: "no"
    command: [migrate]
    environment:
      SPYGLASS_DATABASE_URL: ${SPYGLASS_CELL_B_MIGRATION_DATABASE_URL:?set SPYGLASS_CELL_B_MIGRATION_DATABASE_URL}
      SPYGLASS_MIGRATION_TARGET: cell
    depends_on:
      cell-b-db: {condition: service_healthy}
    networks:
      - database

  global-seed:
    image: postgres:17.11-alpine3.24@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    restart: "no"
    command:
      - psql
      - --host=global-db
      - --username=spyglass_migrator
      - --dbname=spyglass
      - --set=ON_ERROR_STOP=1
      - --set=cell_a_route_origin=${SPYGLASS_CELL_A_ROUTE_ORIGIN:?set SPYGLASS_CELL_A_ROUTE_ORIGIN}
      - --set=cell_b_route_origin=${SPYGLASS_CELL_B_ROUTE_ORIGIN:?set SPYGLASS_CELL_B_ROUTE_ORIGIN}
      - --file=/opt/spyglass/seed/global.sql
    environment:
      PGPASSWORD: ${SPYGLASS_GLOBAL_DATABASE_PASSWORD:?set SPYGLASS_GLOBAL_DATABASE_PASSWORD}
    volumes:
      - ./seed/global.sql:/opt/spyglass/seed/global.sql:ro
    depends_on:
      global-migrate: {condition: service_completed_successfully}
    networks:
      - database

  account-api:
    <<: *application
    command: [account-api]
    environment:
      SPYGLASS_ENV: ${SPYGLASS_PROCESS_ENV:?set SPYGLASS_PROCESS_ENV}
      SPYGLASS_ENVIRONMENT: ${SPYGLASS_ENVIRONMENT:?set SPYGLASS_ENVIRONMENT}
      SPYGLASS_HTTP_ADDRESS: :8080
      SPYGLASS_DATABASE_URL: ${SPYGLASS_ACCOUNT_API_DATABASE_URL:?set SPYGLASS_ACCOUNT_API_DATABASE_URL}
      SPYGLASS_STRIPE_WEBHOOK_SECRET: ${SPYGLASS_STRIPE_WEBHOOK_SECRET:?set SPYGLASS_STRIPE_WEBHOOK_SECRET}
      SPYGLASS_STRIPE_SECRET_KEY: ${SPYGLASS_STRIPE_SECRET_KEY:?set SPYGLASS_STRIPE_SECRET_KEY}
      SPYGLASS_STRIPE_MODE: ${SPYGLASS_STRIPE_MODE:?set SPYGLASS_STRIPE_MODE}
      SPYGLASS_APP_ORIGIN: ${SPYGLASS_APP_ORIGIN:?set SPYGLASS_APP_ORIGIN}
      SPYGLASS_PUBLIC_ORIGIN: ${SPYGLASS_PUBLIC_ORIGIN:?set SPYGLASS_PUBLIC_ORIGIN}
      SPYGLASS_MCP_RESOURCE_ORIGIN: ${SPYGLASS_MCP_RESOURCE_ORIGIN:?set SPYGLASS_MCP_RESOURCE_ORIGIN}
      SPYGLASS_LOCAL_MCP_CLIENT_ID: ${SPYGLASS_LOCAL_MCP_CLIENT_ID:-}
      SPYGLASS_LOCAL_MCP_CLIENT_NAME: ${SPYGLASS_LOCAL_MCP_CLIENT_NAME:-}
      SPYGLASS_LOCAL_MCP_CLIENT_REDIRECT_URI: ${SPYGLASS_LOCAL_MCP_CLIENT_REDIRECT_URI:-}
      SPYGLASS_GOOGLE_LOGIN_CLIENT_FILE: ${SPYGLASS_GOOGLE_LOGIN_CLIENT_FILE:-}
      SPYGLASS_PASSKEY_RP_ID: ${SPYGLASS_PASSKEY_RP_ID:?set SPYGLASS_PASSKEY_RP_ID}
      SPYGLASS_NOTIFICATION_ENCRYPTION_KEY: ${SPYGLASS_NOTIFICATION_ENCRYPTION_KEY:?set SPYGLASS_NOTIFICATION_ENCRYPTION_KEY}
      SPYGLASS_NETWORK_ACTOR_KEY: ${SPYGLASS_NETWORK_ACTOR_KEY:?set SPYGLASS_NETWORK_ACTOR_KEY}
      SPYGLASS_PRIVACY_PREFERENCE_KEY: ${SPYGLASS_PRIVACY_PREFERENCE_KEY:?set SPYGLASS_PRIVACY_PREFERENCE_KEY}
      SPYGLASS_ANALYTICS_HANDOFF_COOKIE_DOMAIN: ${SPYGLASS_ANALYTICS_HANDOFF_COOKIE_DOMAIN:?set SPYGLASS_ANALYTICS_HANDOFF_COOKIE_DOMAIN}
      SPYGLASS_AFFILIATE_ENROLLMENT_OPEN: ${SPYGLASS_AFFILIATE_ENROLLMENT_OPEN:-false}
      SPYGLASS_AFFILIATE_ATTRIBUTION_ENABLED: ${SPYGLASS_AFFILIATE_ATTRIBUTION_ENABLED:-false}
      SPYGLASS_AFFILIATE_SETTLEMENT_MODE: ${SPYGLASS_AFFILIATE_SETTLEMENT_MODE:-unconfigured}
      SPYGLASS_AFFILIATE_TERMS_VERSION: ${SPYGLASS_AFFILIATE_TERMS_VERSION:-1}
      SPYGLASS_AFFILIATE_RULE_VERSION: ${SPYGLASS_AFFILIATE_RULE_VERSION:-1}
      SPYGLASS_PASSKEY_ENCRYPTION_KEYS: ${SPYGLASS_PASSKEY_ENCRYPTION_KEYS:?set SPYGLASS_PASSKEY_ENCRYPTION_KEYS}
      SPYGLASS_PASSKEY_ENCRYPTION_ACTIVE_VERSION: ${SPYGLASS_PASSKEY_ENCRYPTION_ACTIVE_VERSION:?set SPYGLASS_PASSKEY_ENCRYPTION_ACTIVE_VERSION}
      SPYGLASS_OBJECT_STORE_ENDPOINT: ${SPYGLASS_OBJECT_STORE_ENDPOINT:?set SPYGLASS_OBJECT_STORE_ENDPOINT}
      SPYGLASS_ACCOUNT_EXPORT_OBJECT_STORE_BUCKET: ${SPYGLASS_ACCOUNT_EXPORT_OBJECT_STORE_BUCKET:?set SPYGLASS_ACCOUNT_EXPORT_OBJECT_STORE_BUCKET}
      SPYGLASS_ACCOUNT_EXPORT_OBJECT_STORE_DOWNLOAD_ACCESS_KEY: ${SPYGLASS_ACCOUNT_EXPORT_OBJECT_STORE_DOWNLOAD_ACCESS_KEY:?set SPYGLASS_ACCOUNT_EXPORT_OBJECT_STORE_DOWNLOAD_ACCESS_KEY}
      SPYGLASS_ACCOUNT_EXPORT_OBJECT_STORE_DOWNLOAD_SECRET_KEY: ${SPYGLASS_ACCOUNT_EXPORT_OBJECT_STORE_DOWNLOAD_SECRET_KEY:?set SPYGLASS_ACCOUNT_EXPORT_OBJECT_STORE_DOWNLOAD_SECRET_KEY}
      SPYGLASS_OBJECT_STORE_SECURE: ${SPYGLASS_OBJECT_STORE_SECURE:-false}
      SPYGLASS_OBJECT_STORE_SERVER_SIDE_ENCRYPTION: ${SPYGLASS_OBJECT_STORE_SERVER_SIDE_ENCRYPTION:-true}
      SPYGLASS_ACCOUNT_EXPORT_DOWNLOAD_KEYS: ${SPYGLASS_ACCOUNT_EXPORT_DOWNLOAD_KEYS:?set SPYGLASS_ACCOUNT_EXPORT_DOWNLOAD_KEYS}
      SPYGLASS_ACCOUNT_EXPORT_DOWNLOAD_ACTIVE_KEY_ID: ${SPYGLASS_ACCOUNT_EXPORT_DOWNLOAD_ACTIVE_KEY_ID:?set SPYGLASS_ACCOUNT_EXPORT_DOWNLOAD_ACTIVE_KEY_ID}
      SPYGLASS_ACCOUNT_EXPORT_DOWNLOAD_CAPABILITY_LIFETIME: ${SPYGLASS_ACCOUNT_EXPORT_DOWNLOAD_CAPABILITY_LIFETIME:-2m}
    expose: ["8080"]
    healthcheck:
      test: [CMD, /spyglass, healthcheck, --url=http://127.0.0.1:8080/health/ready]
      interval: 5s
      timeout: 4s
      retries: 20
      start_period: 10s
    depends_on:
      global-seed: {condition: service_completed_successfully}
      object-store-init: {condition: service_completed_successfully}
    networks:
      - application
      - database

  mcp-gateway:
    <<: *application
    command: [mcp-gateway]
    environment:
