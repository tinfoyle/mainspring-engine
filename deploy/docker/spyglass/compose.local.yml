services:
  edge:
    ports:
      - "127.0.0.1:${SPYGLASS_LOCAL_EDGE_PORT:-8088}:80"
      - "127.0.0.1:${SPYGLASS_LOCAL_TLS_PORT:-8444}:443"
    volumes:
      - ./Caddyfile.local:/etc/caddy/Caddyfile:ro
    depends_on:
      google-oauth-fixture: {condition: service_healthy}

  google-oauth-fixture:
    build:
      context: ../../..
      dockerfile: deploy/docker/spyglass/google-fixture/Dockerfile
      target: fixture
    image: spyglass-google-oauth-fixture:local
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    environment:
      GOOGLE_FIXTURE_CLIENT_ID: ${SPYGLASS_GOOGLE_FIXTURE_CLIENT_ID}
      GOOGLE_FIXTURE_CLIENT_SECRET: ${SPYGLASS_GOOGLE_FIXTURE_CLIENT_SECRET}
      GOOGLE_FIXTURE_REDIRECT_ORIGIN: ${SPYGLASS_APP_ORIGIN}
    expose: ["8080"]
    healthcheck:
      test: [CMD, /google-oauth-fixture, healthcheck]
      interval: 5s
      timeout: 4s
      retries: 20
      start_period: 5s
    networks: [application]

  provider-secret-init:
    build:
      context: ../../..
      dockerfile: deploy/docker/spyglass/google-fixture/Dockerfile
      target: secret-init
    image: spyglass-provider-secret-init:local
    restart: "no"
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER]
    security_opt: [no-new-privileges:true]
    command: [/provider-a, /provider-b]
    volumes:
      - provider-secrets-a:/provider-a
      - provider-secrets-b:/provider-b

  provider-credential-fixture-a:
    profiles: [credential-fixture]
    build:
      context: ../../..
      dockerfile: deploy/docker/spyglass/google-fixture/Dockerfile
      target: provider-credential-fixture
    image: spyglass-provider-credential-fixture:local
    restart: "no"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      SPYGLASS_ENVIRONMENT: local
      SPYGLASS_PROVIDER_SECRET_ROOT: /var/lib/spyglass/provider/vault
      SPYGLASS_PROVIDER_SECRET_KEY_FILE: /var/lib/spyglass/provider/key
    volumes:
      - provider-secrets-a:/var/lib/spyglass/provider

  web-research-fixture:
    build:
      context: ../../..
      dockerfile: deploy/docker/spyglass/google-fixture/Dockerfile
      target: web-research-fixture
    image: spyglass-web-research-fixture:local
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      WEB_RESEARCH_FIXTURE_PUBLIC_ORIGIN: ${SPYGLASS_WEB_RESEARCH_FIXTURE_PUBLIC_ORIGIN}
      WEB_RESEARCH_FIXTURE_TOKEN: ${SPYGLASS_WEB_RESEARCH_FIXTURE_TOKEN}
    volumes:
      - ./web-research-fixture/ca.crt:/run/web-research-fixture/ca.crt:ro
      - ./web-research-fixture/web-research-fixture.crt:/run/web-research-fixture/tls.crt:ro
      - ./web-research-fixture/web-research-fixture.key:/run/web-research-fixture/tls.key:ro
    expose: ["9443"]
    healthcheck:
      test: [CMD, /web-research-fixture, healthcheck]
      interval: 5s
      timeout: 4s
      retries: 20
      start_period: 5s
    networks: [application]

  website:
    build:
      context: ../../../ui
      dockerfile: Dockerfile
      target: public-runtime
    image: infinite-ocean-public-ui:local

  private-ui:
    build:
      context: ../../../ui
      dockerfile: Dockerfile
      target: app-runtime
    image: infinite-ocean-private-ui:local

  global-migrate:
    build: &application-build
      context: ../../..
      dockerfile: Dockerfile
      args:
        VERSION: phase2.5-local
        REVISION: local
        CREATED: local
    image: spyglass-application:local
    environment:
      SPYGLASS_ANALYTICS_REPORT_DATABASE_URL: ${SPYGLASS_ANALYTICS_REPORT_DATABASE_URL}

  global-roles:
    image: postgres:17.11-alpine3.24@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    restart: "no"
    command: [psql, --host=global-db, --username=spyglass_migrator, --dbname=spyglass, --set=ON_ERROR_STOP=1, --file=/opt/spyglass/roles/global.sql]
    environment:
      PGPASSWORD: ${SPYGLASS_GLOBAL_DATABASE_PASSWORD}
      SPYGLASS_ACCOUNT_API_DATABASE_PASSWORD: ${SPYGLASS_ACCOUNT_API_DATABASE_PASSWORD}
      SPYGLASS_APP_ROUTER_DATABASE_PASSWORD: ${SPYGLASS_APP_ROUTER_DATABASE_PASSWORD}
      SPYGLASS_MCP_GATEWAY_DATABASE_PASSWORD: ${SPYGLASS_MCP_GATEWAY_DATABASE_PASSWORD}
      SPYGLASS_ADMISSION_DATABASE_PASSWORD: ${SPYGLASS_ADMISSION_DATABASE_PASSWORD}
      SPYGLASS_BILLING_WORKER_DATABASE_PASSWORD: ${SPYGLASS_BILLING_WORKER_DATABASE_PASSWORD}
      SPYGLASS_NOTIFICATION_WORKER_DATABASE_PASSWORD: ${SPYGLASS_NOTIFICATION_WORKER_DATABASE_PASSWORD}
      SPYGLASS_ENTITLEMENT_WORKER_DATABASE_PASSWORD: ${SPYGLASS_ENTITLEMENT_WORKER_DATABASE_PASSWORD}
      SPYGLASS_ACCOUNT_LIFECYCLE_WORKER_DATABASE_PASSWORD: ${SPYGLASS_ACCOUNT_LIFECYCLE_WORKER_DATABASE_PASSWORD}
      SPYGLASS_ACCOUNT_EXPORT_BUILD_WORKER_DATABASE_PASSWORD: ${SPYGLASS_ACCOUNT_EXPORT_BUILD_WORKER_DATABASE_PASSWORD}
      SPYGLASS_ACCOUNT_EXPORT_EXPIRY_WORKER_DATABASE_PASSWORD: ${SPYGLASS_ACCOUNT_EXPORT_EXPIRY_WORKER_DATABASE_PASSWORD}
      SPYGLASS_ANALYTICS_REPORTER_DATABASE_PASSWORD: ${SPYGLASS_ANALYTICS_REPORTER_DATABASE_PASSWORD}
      SPYGLASS_IDENTITY_MAINTENANCE_WORKER_DATABASE_PASSWORD: ${SPYGLASS_IDENTITY_MAINTENANCE_WORKER_DATABASE_PASSWORD}
      SPYGLASS_AFFILIATE_RETENTION_WORKER_DATABASE_PASSWORD: ${SPYGLASS_AFFILIATE_RETENTION_WORKER_DATABASE_PASSWORD}
      SPYGLASS_WORK_RECONCILER_DATABASE_PASSWORD: ${SPYGLASS_WORK_RECONCILER_DATABASE_PASSWORD}
      SPYGLASS_BASELINE_MAINTENANCE_WORKER_DATABASE_PASSWORD: ${SPYGLASS_BASELINE_MAINTENANCE_WORKER_DATABASE_PASSWORD}
      SPYGLASS_PROTOTYPE_MIGRATION_DATABASE_PASSWORD: ${SPYGLASS_PROTOTYPE_MIGRATION_DATABASE_PASSWORD}
      SPYGLASS_INTEGRATION_CONNECTOR_WORKER_DATABASE_PASSWORD: ${SPYGLASS_INTEGRATION_CONNECTOR_WORKER_DATABASE_PASSWORD}
    volumes:
      - ./roles/global.local.sql:/opt/spyglass/roles/global.sql:ro
    depends_on:
      global-migrate: {condition: service_completed_successfully}
    networks: [database]

  cell-a-migrate:
    image: spyglass-application:local

  cell-a-roles:
    image: postgres:17.11-alpine3.24@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    restart: "no"
    command: [psql, --host=cell-a-db, --username=spyglass_migrator, --dbname=spyglass, --set=ON_ERROR_STOP=1, --file=/opt/spyglass/roles/cell.sql]
    environment:
      PGPASSWORD: ${SPYGLASS_CELL_A_DATABASE_PASSWORD}
      SPYGLASS_APP_API_DATABASE_PASSWORD: ${SPYGLASS_APP_API_DATABASE_PASSWORD}
      SPYGLASS_ROUTE_RECEIPT_WORKER_DATABASE_PASSWORD: ${SPYGLASS_ROUTE_RECEIPT_WORKER_DATABASE_PASSWORD}
      SPYGLASS_WORK_RECONCILER_DATABASE_PASSWORD: ${SPYGLASS_WORK_RECONCILER_DATABASE_PASSWORD}
      SPYGLASS_AGENT_DISPATCH_WORKER_DATABASE_PASSWORD: ${SPYGLASS_AGENT_DISPATCH_WORKER_DATABASE_PASSWORD}
      SPYGLASS_SCHEDULE_EXECUTION_WORKER_DATABASE_PASSWORD: ${SPYGLASS_SCHEDULE_EXECUTION_WORKER_DATABASE_PASSWORD}
      SPYGLASS_AGENT_PROJECTION_WORKER_DATABASE_PASSWORD: ${SPYGLASS_AGENT_PROJECTION_WORKER_DATABASE_PASSWORD}
      SPYGLASS_KNOWLEDGE_DOCUMENT_WORKER_DATABASE_PASSWORD: ${SPYGLASS_KNOWLEDGE_DOCUMENT_WORKER_DATABASE_PASSWORD}
      SPYGLASS_BASELINE_MAINTENANCE_WORKER_DATABASE_PASSWORD: ${SPYGLASS_BASELINE_MAINTENANCE_WORKER_DATABASE_PASSWORD}
      SPYGLASS_PROTOTYPE_MIGRATION_DATABASE_PASSWORD: ${SPYGLASS_PROTOTYPE_MIGRATION_DATABASE_PASSWORD}
      SPYGLASS_RUNNER_CONTROLLER_DATABASE_PASSWORD: ${SPYGLASS_CELL_A_RUNNER_CONTROLLER_DATABASE_PASSWORD}
      SPYGLASS_RUNNER_BROKER_DATABASE_PASSWORD: ${SPYGLASS_CELL_A_RUNNER_BROKER_DATABASE_PASSWORD}
      SPYGLASS_INTEGRATION_CONNECTOR_WORKER_DATABASE_PASSWORD: ${SPYGLASS_INTEGRATION_CONNECTOR_WORKER_DATABASE_PASSWORD}
      SPYGLASS_ACCOUNT_EXPORT_BUILD_WORKER_DATABASE_PASSWORD: ${SPYGLASS_ACCOUNT_EXPORT_BUILD_WORKER_DATABASE_PASSWORD}
    volumes:
      - ./roles/cell.local.sql:/opt/spyglass/roles/cell.sql:ro
    depends_on:
      cell-a-migrate: {condition: service_completed_successfully}
    networks: [database]

  cell-b-migrate:
    image: spyglass-application:local

  cell-b-roles:
    image: postgres:17.11-alpine3.24@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    restart: "no"
    command: [psql, --host=cell-b-db, --username=spyglass_migrator, --dbname=spyglass, --set=ON_ERROR_STOP=1, --file=/opt/spyglass/roles/cell.sql]
    environment:
      PGPASSWORD: ${SPYGLASS_CELL_B_DATABASE_PASSWORD}
      SPYGLASS_APP_API_DATABASE_PASSWORD: ${SPYGLASS_APP_API_DATABASE_PASSWORD}
      SPYGLASS_ROUTE_RECEIPT_WORKER_DATABASE_PASSWORD: ${SPYGLASS_ROUTE_RECEIPT_WORKER_DATABASE_PASSWORD}
      SPYGLASS_WORK_RECONCILER_DATABASE_PASSWORD: ${SPYGLASS_WORK_RECONCILER_DATABASE_PASSWORD}
      SPYGLASS_AGENT_DISPATCH_WORKER_DATABASE_PASSWORD: ${SPYGLASS_AGENT_DISPATCH_WORKER_DATABASE_PASSWORD}
      SPYGLASS_SCHEDULE_EXECUTION_WORKER_DATABASE_PASSWORD: ${SPYGLASS_SCHEDULE_EXECUTION_WORKER_DATABASE_PASSWORD}
      SPYGLASS_AGENT_PROJECTION_WORKER_DATABASE_PASSWORD: ${SPYGLASS_AGENT_PROJECTION_WORKER_DATABASE_PASSWORD}
      SPYGLASS_KNOWLEDGE_DOCUMENT_WORKER_DATABASE_PASSWORD: ${SPYGLASS_KNOWLEDGE_DOCUMENT_WORKER_DATABASE_PASSWORD}
      SPYGLASS_BASELINE_MAINTENANCE_WORKER_DATABASE_PASSWORD: ${SPYGLASS_BASELINE_MAINTENANCE_WORKER_DATABASE_PASSWORD}
      SPYGLASS_PROTOTYPE_MIGRATION_DATABASE_PASSWORD: ${SPYGLASS_PROTOTYPE_MIGRATION_DATABASE_PASSWORD}
      SPYGLASS_RUNNER_CONTROLLER_DATABASE_PASSWORD: ${SPYGLASS_CELL_B_RUNNER_CONTROLLER_DATABASE_PASSWORD}
      SPYGLASS_RUNNER_BROKER_DATABASE_PASSWORD: ${SPYGLASS_CELL_B_RUNNER_BROKER_DATABASE_PASSWORD}
      SPYGLASS_INTEGRATION_CONNECTOR_WORKER_DATABASE_PASSWORD: ${SPYGLASS_INTEGRATION_CONNECTOR_WORKER_DATABASE_PASSWORD}
      SPYGLASS_ACCOUNT_EXPORT_BUILD_WORKER_DATABASE_PASSWORD: ${SPYGLASS_ACCOUNT_EXPORT_BUILD_WORKER_DATABASE_PASSWORD}
    volumes:
      - ./roles/cell.local.sql:/opt/spyglass/roles/cell.sql:ro
    depends_on:
      cell-b-migrate: {condition: service_completed_successfully}
    networks: [database]

  account-api:
    image: spyglass-application:local
    depends_on:
      global-roles: {condition: service_completed_successfully}
    networks: [application, database, edge]

  account-export-build-worker-a:
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /var/lib/spyglass/account-export:size=34g,mode=0700,uid=65532,gid=65532
    depends_on:
      global-roles: {condition: service_completed_successfully}
      cell-a-roles: {condition: service_completed_successfully}
      object-store-init: {condition: service_completed_successfully}

  account-export-build-worker-b:
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /var/lib/spyglass/account-export:size=34g,mode=0700,uid=65532,gid=65532
    depends_on:
      global-roles: {condition: service_completed_successfully}
      cell-b-roles: {condition: service_completed_successfully}
      object-store-init: {condition: service_completed_successfully}

  account-export-expiry-worker:
    depends_on:
      global-roles: {condition: service_completed_successfully}
      object-store-init: {condition: service_completed_successfully}

  admission-api:
    image: spyglass-application:local
    depends_on:
      global-roles: {condition: service_completed_successfully}

  app-api-a:
    image: spyglass-application:local
    depends_on:
      cell-a-roles: {condition: service_completed_successfully}
      provider-secret-init: {condition: service_completed_successfully, required: false}
      google-oauth-fixture: {condition: service_healthy}
      web-research-fixture: {condition: service_healthy}
    environment:
      SPYGLASS_PROVIDER_SECRET_ROOT: /var/lib/spyglass/provider/vault
      SPYGLASS_PROVIDER_SECRET_KEY_FILE: /var/lib/spyglass/provider/key
      SPYGLASS_GOOGLE_OAUTH_CLIENT_ID: ${SPYGLASS_GOOGLE_FIXTURE_CLIENT_ID}
      SPYGLASS_GOOGLE_OAUTH_CLIENT_SECRET: ${SPYGLASS_GOOGLE_FIXTURE_CLIENT_SECRET}
      SPYGLASS_GOOGLE_OAUTH_AUTHORIZATION_ENDPOINT: ${SPYGLASS_GOOGLE_FIXTURE_PUBLIC_ORIGIN}/o/oauth2/v2/auth
      SPYGLASS_GOOGLE_OAUTH_TOKEN_ENDPOINT: http://google-oauth-fixture:8080/token
      SPYGLASS_GOOGLE_OAUTH_REVOCATION_ENDPOINT: http://google-oauth-fixture:8080/revoke
      SPYGLASS_WEB_RESEARCH_SEARCH_ENDPOINT: ${SPYGLASS_WEB_RESEARCH_FIXTURE_PUBLIC_ORIGIN}/v2/search
      SPYGLASS_WEB_RESEARCH_FIXTURE_HOST: research.infiniteocean.test
      SPYGLASS_WEB_RESEARCH_FIXTURE_ADDRESS: web-research-fixture:9443
      SPYGLASS_WEB_RESEARCH_FIXTURE_CA_FILE: /etc/spyglass/web-research-fixture-ca.crt
    volumes:
      - provider-secrets-a:/var/lib/spyglass/provider
      - ./web-research-fixture/ca.crt:/etc/spyglass/web-research-fixture-ca.crt:ro

  app-api-b:
    image: spyglass-application:local
    depends_on:
      cell-b-roles: {condition: service_completed_successfully}
      provider-secret-init: {condition: service_completed_successfully, required: false}
      google-oauth-fixture: {condition: service_healthy}
      web-research-fixture: {condition: service_healthy}
    environment:
      SPYGLASS_PROVIDER_SECRET_ROOT: /var/lib/spyglass/provider/vault
      SPYGLASS_PROVIDER_SECRET_KEY_FILE: /var/lib/spyglass/provider/key
      SPYGLASS_GOOGLE_OAUTH_CLIENT_ID: ${SPYGLASS_GOOGLE_FIXTURE_CLIENT_ID}
      SPYGLASS_GOOGLE_OAUTH_CLIENT_SECRET: ${SPYGLASS_GOOGLE_FIXTURE_CLIENT_SECRET}
      SPYGLASS_GOOGLE_OAUTH_AUTHORIZATION_ENDPOINT: ${SPYGLASS_GOOGLE_FIXTURE_PUBLIC_ORIGIN}/o/oauth2/v2/auth
      SPYGLASS_GOOGLE_OAUTH_TOKEN_ENDPOINT: http://google-oauth-fixture:8080/token
      SPYGLASS_GOOGLE_OAUTH_REVOCATION_ENDPOINT: http://google-oauth-fixture:8080/revoke
      SPYGLASS_WEB_RESEARCH_SEARCH_ENDPOINT: ${SPYGLASS_WEB_RESEARCH_FIXTURE_PUBLIC_ORIGIN}/v2/search
      SPYGLASS_WEB_RESEARCH_FIXTURE_HOST: research.infiniteocean.test
      SPYGLASS_WEB_RESEARCH_FIXTURE_ADDRESS: web-research-fixture:9443
      SPYGLASS_WEB_RESEARCH_FIXTURE_CA_FILE: /etc/spyglass/web-research-fixture-ca.crt
    volumes:
      - provider-secrets-b:/var/lib/spyglass/provider
      - ./web-research-fixture/ca.crt:/etc/spyglass/web-research-fixture-ca.crt:ro

  app-router:
    image: spyglass-application:local
    depends_on:
      global-roles: {condition: service_completed_successfully}

  imap-fixture:
    build:
      context: ../../..
      dockerfile: deploy/docker/spyglass/google-fixture/Dockerfile
      target: imap-fixture
    image: spyglass-imap-fixture:local
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    environment:
      IMAP_FIXTURE_USERNAME: ${SPYGLASS_IMAP_FIXTURE_USERNAME}
      IMAP_FIXTURE_PASSWORD: ${SPYGLASS_IMAP_FIXTURE_PASSWORD}
    volumes:
      - ./imap-fixture/ca.crt:/run/imap-fixture/ca.crt:ro
      - ./imap-fixture/imap-fixture.crt:/run/imap-fixture/tls.crt:ro
      - ./imap-fixture/imap-fixture.key:/run/imap-fixture/tls.key:ro
    ports:
      - "127.0.0.1:${SPYGLASS_LOCAL_IMAP_PORT:-1993}:9993"
    expose: ["9993"]
    healthcheck:
      test: [CMD, /imap-fixture, healthcheck]
      interval: 5s
      timeout: 4s
      retries: 20
      start_period: 5s
    networks: [application]

  mailpit:
    image: axllent/mailpit:v1.30.7@sha256:d5ecbb067db3705fa953d79e1b7f81ef84038df67aba6c52825d8c02a1ea748a
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    environment:
      MP_SMTP_TLS_CERT: /etc/mailpit/mailpit.crt
      MP_SMTP_TLS_KEY: /etc/mailpit/mailpit.key
      MP_SMTP_REQUIRE_TLS: "true"
    volumes:
      - ./mailpit/mailpit.crt:/etc/mailpit/mailpit.crt:ro
      - ./mailpit/mailpit.key:/etc/mailpit/mailpit.key:ro
    ports:
      - "127.0.0.1:${SPYGLASS_LOCAL_SMTP_PORT:-1026}:1025"
      - "127.0.0.1:${SPYGLASS_LOCAL_MAILPIT_PORT:-8025}:8025"
    expose: ["1025"]
    networks: [edge, application]

  prometheus:
    profiles: [observability]
    image: quay.io/prometheus/prometheus:v3.14.0@sha256:5ce7540c3c00ef4ab0c9d2c995c6a5b9c421f44b4a115d97a2c7af3b1c21cbb0
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /prometheus:size=128m,mode=0770,uid=65534,gid=65534
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=1h
      - --web.listen-address=:9090
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:${SPYGLASS_LOCAL_PROMETHEUS_PORT:-9090}:9090"
    healthcheck:
      test: [CMD, /bin/wget, --quiet, --tries=1, --spider, http://127.0.0.1:9090/-/ready]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks: [edge, application]

  billing-worker:
    depends_on:
      global-roles: {condition: service_completed_successfully}

  notification-worker:
    depends_on:
      global-roles: {condition: service_completed_successfully}
      mailpit: {condition: service_started}
    volumes:
      - ./mailpit/ca.crt:/etc/spyglass/mailpit-ca.crt:ro

  entitlement-worker:
    depends_on:
      global-roles: {condition: service_completed_successfully}

  account-lifecycle-worker:
    depends_on:
      global-roles: {condition: service_completed_successfully}

  identity-maintenance-worker:
    depends_on:
      global-roles: {condition: service_completed_successfully}

  affiliate-retention-worker:
    depends_on:
      global-roles: {condition: service_completed_successfully}

  work-reconciler-a:
    depends_on:
      global-roles: {condition: service_completed_successfully}
      cell-a-roles: {condition: service_completed_successfully}

  work-reconciler-b:
    depends_on:
      global-roles: {condition: service_completed_successfully}
      cell-b-roles: {condition: service_completed_successfully}

  baseline-maintenance-worker-a:
    depends_on:
      global-roles: {condition: service_completed_successfully}
      cell-a-roles: {condition: service_completed_successfully}

  baseline-maintenance-worker-b:
    depends_on:
      global-roles: {condition: service_completed_successfully}
      cell-b-roles: {condition: service_completed_successfully}

  integration-connector-worker-a:
    depends_on:
      global-roles: {condition: service_completed_successfully}
      cell-a-roles: {condition: service_completed_successfully}
      provider-secret-init: {condition: service_completed_successfully, required: false}
      google-oauth-fixture: {condition: service_healthy, required: false}
      imap-fixture: {condition: service_healthy, required: false}
      web-research-fixture: {condition: service_healthy, required: false}
    environment:
      SPYGLASS_PROVIDER_SECRET_ROOT: /var/lib/spyglass/provider/vault
      SPYGLASS_PROVIDER_SECRET_KEY_FILE: /var/lib/spyglass/provider/key
      SPYGLASS_GOOGLE_OAUTH_CLIENT_ID: ${SPYGLASS_GOOGLE_FIXTURE_CLIENT_ID}
      SPYGLASS_GOOGLE_OAUTH_CLIENT_SECRET: ${SPYGLASS_GOOGLE_FIXTURE_CLIENT_SECRET}
      SPYGLASS_GOOGLE_OAUTH_TOKEN_ENDPOINT: http://google-oauth-fixture:8080/token
      SPYGLASS_GOOGLE_DRIVE_ENDPOINT: http://google-oauth-fixture:8080/drive/v3
      SPYGLASS_IMAP_ROOT_CA_FILE: /etc/spyglass/imap-fixture-ca.crt
      SPYGLASS_WEB_RESEARCH_SEARCH_ENDPOINT: ${SPYGLASS_WEB_RESEARCH_FIXTURE_PUBLIC_ORIGIN}/v2/search
      SPYGLASS_WEB_RESEARCH_FIXTURE_HOST: research.infiniteocean.test
      SPYGLASS_WEB_RESEARCH_FIXTURE_ADDRESS: web-research-fixture:9443
      SPYGLASS_WEB_RESEARCH_FIXTURE_CA_FILE: /etc/spyglass/web-research-fixture-ca.crt
    volumes:
      - ./mock-connector/local.json:/run/spyglass/mock-connector.json:ro
      - ./imap-fixture/ca.crt:/etc/spyglass/imap-fixture-ca.crt:ro
      - ./web-research-fixture/ca.crt:/etc/spyglass/web-research-fixture-ca.crt:ro
      - provider-secrets-a:/var/lib/spyglass/provider

  integration-connector-worker-b:
    depends_on:
      global-roles: {condition: service_completed_successfully}
      cell-b-roles: {condition: service_completed_successfully}
      provider-secret-init: {condition: service_completed_successfully, required: false}
      google-oauth-fixture: {condition: service_healthy, required: false}
      imap-fixture: {condition: service_healthy, required: false}
      web-research-fixture: {condition: service_healthy, required: false}
    environment:
      SPYGLASS_PROVIDER_SECRET_ROOT: /var/lib/spyglass/provider/vault
      SPYGLASS_PROVIDER_SECRET_KEY_FILE: /var/lib/spyglass/provider/key
      SPYGLASS_GOOGLE_OAUTH_CLIENT_ID: ${SPYGLASS_GOOGLE_FIXTURE_CLIENT_ID}
      SPYGLASS_GOOGLE_OAUTH_CLIENT_SECRET: ${SPYGLASS_GOOGLE_FIXTURE_CLIENT_SECRET}
      SPYGLASS_GOOGLE_OAUTH_TOKEN_ENDPOINT: http://google-oauth-fixture:8080/token
      SPYGLASS_GOOGLE_DRIVE_ENDPOINT: http://google-oauth-fixture:8080/drive/v3
      SPYGLASS_IMAP_ROOT_CA_FILE: /etc/spyglass/imap-fixture-ca.crt
      SPYGLASS_WEB_RESEARCH_SEARCH_ENDPOINT: ${SPYGLASS_WEB_RESEARCH_FIXTURE_PUBLIC_ORIGIN}/v2/search
      SPYGLASS_WEB_RESEARCH_FIXTURE_HOST: research.infiniteocean.test
      SPYGLASS_WEB_RESEARCH_FIXTURE_ADDRESS: web-research-fixture:9443
      SPYGLASS_WEB_RESEARCH_FIXTURE_CA_FILE: /etc/spyglass/web-research-fixture-ca.crt
    volumes:
      - ./mock-connector/local.json:/run/spyglass/mock-connector.json:ro
      - ./imap-fixture/ca.crt:/etc/spyglass/imap-fixture-ca.crt:ro
      - ./web-research-fixture/ca.crt:/etc/spyglass/web-research-fixture-ca.crt:ro
      - provider-secrets-b:/var/lib/spyglass/provider

  route-receipt-worker-a:
    depends_on:
      cell-a-roles: {condition: service_completed_successfully}

  route-receipt-worker-b:
    depends_on:
      cell-b-roles: {condition: service_completed_successfully}

  agent-dispatch-worker-a:
    depends_on:
      cell-a-roles: {condition: service_completed_successfully}

  agent-dispatch-worker-b:
    depends_on:
      cell-b-roles: {condition: service_completed_successfully}

  schedule-execution-worker-a:
    depends_on:
      cell-a-roles: {condition: service_completed_successfully}

  schedule-execution-worker-b:
    depends_on:
      cell-b-roles: {condition: service_completed_successfully}

  agent-projection-worker-a:
    depends_on:
      cell-a-roles: {condition: service_completed_successfully}

  agent-projection-worker-b:
    depends_on:
      cell-b-roles: {condition: service_completed_successfully}

  knowledge-document-worker-a:
    depends_on:
      cell-a-roles: {condition: service_completed_successfully}

  knowledge-document-worker-b:
    depends_on:
      cell-b-roles: {condition: service_completed_successfully}

  website-test:
    profiles: [test]
    build:
      context: ../../../ui
      dockerfile: Dockerfile
      target: test
    image: infinite-ocean-customer-ui:test

  identity-browser-test:
    profiles: [test]
    build:
      context: ../../../ui
      dockerfile: Dockerfile
      target: identity-browser-test
    image: infinite-ocean-identity-browser-test:local
    network_mode: service:edge
    depends_on:
      edge: {condition: service_started}
    environment:
      SPYGLASS_IDENTITY_BASE_URL: https://app.infiniteocean.localhost:8444
      SPYGLASS_IDENTITY_MAILPIT_URL: http://mailpit:8025

  test-db:
    profiles: [test]
    image: postgres:17.11-alpine3.24@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    environment:
      POSTGRES_PASSWORD: spyglass-test-only
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d postgres"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
    networks:
      - database

  go-test:
    profiles: [test]
    build:
      context: ../../..
      dockerfile: Dockerfile
      target: test-runtime
    image: spyglass-go-test:local
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        go test -count=1 ./...
        go test -count=1 -race ./...
        go vet ./...
        test -z "$$(gofmt -l cmd internal migrations)"
        go run ./cmd/apicontract -check
    environment:
      GOMAXPROCS: "2"
      GOMEMLIMIT: 2GiB
      GOFLAGS: -p=1
      SPYGLASS_POSTGRES_TEST_URL: postgres://postgres:spyglass-test-only@test-db:5432/postgres?sslmode=disable
      SPYGLASS_S3_TEST_ENDPOINT: object-store:9000
      SPYGLASS_S3_TEST_ACCESS_KEY: ${SPYGLASS_OBJECT_STORE_ACCESS_KEY}
      SPYGLASS_S3_TEST_SECRET_KEY: ${SPYGLASS_OBJECT_STORE_SECRET_KEY}
      SPYGLASS_S3_APP_TEST_ACCESS_KEY: ${SPYGLASS_OBJECT_STORE_APP_ACCESS_KEY}
      SPYGLASS_S3_APP_TEST_SECRET_KEY: ${SPYGLASS_OBJECT_STORE_APP_SECRET_KEY}
      SPYGLASS_S3_WORKER_TEST_ACCESS_KEY: ${SPYGLASS_OBJECT_STORE_WORKER_ACCESS_KEY}
      SPYGLASS_S3_WORKER_TEST_SECRET_KEY: ${SPYGLASS_OBJECT_STORE_WORKER_SECRET_KEY}
      SPYGLASS_S3_CONNECTOR_TEST_ACCESS_KEY: ${SPYGLASS_OBJECT_STORE_CONNECTOR_ACCESS_KEY}
      SPYGLASS_S3_CONNECTOR_TEST_SECRET_KEY: ${SPYGLASS_OBJECT_STORE_CONNECTOR_SECRET_KEY}
      SPYGLASS_S3_TEST_BUCKET: ${SPYGLASS_OBJECT_STORE_BUCKET}
      SPYGLASS_EXPORT_S3_TEST_BUCKET: ${SPYGLASS_ACCOUNT_EXPORT_OBJECT_STORE_BUCKET}
      SPYGLASS_EXPORT_S3_TEST_ACCESS_KEY: ${SPYGLASS_ACCOUNT_EXPORT_OBJECT_STORE_BUILD_ACCESS_KEY}
      SPYGLASS_EXPORT_S3_TEST_SECRET_KEY: ${SPYGLASS_ACCOUNT_EXPORT_OBJECT_STORE_BUILD_SECRET_KEY}
      SPYGLASS_TIKA_TEST_ENDPOINT: http://document-extractor:9998
      SPYGLASS_CLAMAV_TEST_ADDRESS: malware-scanner:3310
    depends_on:
      test-db: {condition: service_healthy}
      object-store-init: {condition: service_completed_successfully}
      document-extractor: {condition: service_healthy}
      malware-scanner: {condition: service_healthy}
    networks:
      - application
      - database

volumes:
  provider-secrets-a:
  provider-secrets-b:
