name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    env:
      SPYGLASS_POSTGRES_TEST_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
      SPYGLASS_S3_TEST_ENDPOINT: 127.0.0.1:9000
      SPYGLASS_S3_TEST_ACCESS_KEY: spyglass-ci-object
      SPYGLASS_S3_TEST_SECRET_KEY: spyglass-ci-object-secret
      SPYGLASS_S3_TEST_BUCKET: spyglass-documents
      SPYGLASS_TIKA_TEST_ENDPOINT: http://127.0.0.1:9998
      SPYGLASS_CLAMAV_TEST_ADDRESS: 127.0.0.1:3310
    services:
      postgres:
        image: postgres:17.11-alpine3.24@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: 1.26.6
          cache: true
      - name: Start versioned S3-compatible test storage
        run: |
          docker run --detach --name spyglass-ci-minio \
            --publish 127.0.0.1:9000:9000 \
            --env MINIO_ROOT_USER=spyglass-ci-object \
            --env MINIO_ROOT_PASSWORD=spyglass-ci-object-secret \
            --env 'MINIO_KMS_SECRET_KEY=spyglass:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=' \
            minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e \
            server /data
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/ready >/dev/null; then break; fi
            test "$attempt" != 30
            sleep 1
          done
          docker run --rm --network host \
            --env MC_CONFIG_DIR=/tmp/.mc \
            --entrypoint /bin/sh \
            minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727 \
            -ec 'mc alias set spyglass http://127.0.0.1:9000 spyglass-ci-object spyglass-ci-object-secret && mc mb --ignore-existing spyglass/spyglass-documents && mc version enable spyglass/spyglass-documents'
      - name: Start constrained document extractor
        run: |
          docker run --detach --name spyglass-ci-tika \
            --publish 127.0.0.1:9998:9998 \
            --memory 1536m \
            --cpus 2 \
            --pids-limit 256 \
            --read-only \
            --tmpfs /tmp:size=256m,mode=1777,uid=35002,gid=35002 \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --volume "$PWD/deploy/docker/spyglass/tika/tika-config.xml:/etc/tika/tika-config.xml:ro" \
            apache/tika@sha256:2a565f1ea1290bdcb74a7d35957d16a989ed44ef98790dcdcc28121d728fa583 \
            -c /etc/tika/tika-config.xml
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:9998/version >/dev/null; then break; fi
            test "$attempt" != 60
            sleep 1
          done
      - name: Start private malware scanner
        run: |
          docker run --detach --name spyglass-ci-clamav \
            --publish 127.0.0.1:3310:3310 \
            --env CLAMAV_NO_FRESHCLAMD=true \
            --env CLAMD_CONF_StreamMaxLength=52428800 \
            --env CLAMD_CONF_MaxFileSize=52428800 \
            --env CLAMD_CONF_MaxScanSize=104857600 \
            --env CLAMD_CONF_MaxScanTime=120000 \
            --memory 4g \
            --cpus 2 \
            --pids-limit 256 \
            --security-opt no-new-privileges:true \
            clamav/clamav@sha256:c3bfbf2a2c9abc1fc179e63832a9e8bfac901ede83853e3fa10acf6f1fb5c803
          for attempt in $(seq 1 120); do
            if [ "$(docker inspect spyglass-ci-clamav --format '{{if .State.Health}}{{.State.Health.Status}}{{end}}')" = healthy ]; then break; fi
            test "$attempt" != 120
            sleep 1
          done
      - run: go test ./...
      - run: go test -race ./...
      - run: go vet ./...
      - run: go run ./cmd/apicontract -check
      - name: Check customer API backward compatibility
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          git show FETCH_HEAD:api/spyglass.openapi.json > "$RUNNER_TEMP/spyglass-base.openapi.json"
          go run ./cmd/apicompat -base "$RUNNER_TEMP/spyglass-base.openapi.json" -head api/spyglass.openapi.json
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
      - run: test -z "$(gofmt -l cmd internal migrations)"
      - run: kubectl kustomize deploy/kubernetes/reference >/dev/null
      - run: bash deploy/kubernetes/reference/verify.sh
      - run: bash deploy/kubernetes/overlays/verify.sh

  website:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm audit

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify Hostinger stage release contract
        run: bash deploy/docker/spyglass/test-stage-contract.sh
      - name: Build static scratch image
        env:
          DOCKER_BUILDKIT: "1"
        run: |
          docker build \
            --build-arg VERSION=0.0.0-ci \
            --build-arg "REVISION=${GITHUB_SHA}" \
            --build-arg CREATED=1970-01-01T00:00:00Z \
            --tag "spyglass-ci:${GITHUB_SHA}" .
      - name: Verify runtime identity and user
        run: |
          test "$(docker inspect --format '{{.Config.User}}' "spyglass-ci:${GITHUB_SHA}")" = "65532:65532"
          docker run --rm "spyglass-ci:${GITHUB_SHA}" version > /tmp/spyglass-version.json
          test "$(jq -r .version /tmp/spyglass-version.json)" = "0.0.0-ci"
          test "$(jq -r .revision /tmp/spyglass-version.json)" = "${GITHUB_SHA}"
      - name: Build and verify customer UI runtime images
        env:
          DOCKER_BUILDKIT: "1"
        run: |
          set -euo pipefail
          docker build \
            --target public-runtime \
            --build-arg VERSION=0.0.0-ci \
            --build-arg "REVISION=${GITHUB_SHA}" \
            --build-arg CREATED=1970-01-01T00:00:00Z \
            --tag "infinite-ocean-public-ui-ci:${GITHUB_SHA}" \
            ui
          docker build \
            --target app-runtime \
            --build-arg VERSION=0.0.0-ci \
            --build-arg "REVISION=${GITHUB_SHA}" \
            --build-arg CREATED=1970-01-01T00:00:00Z \
            --tag "infinite-ocean-private-ui-ci:${GITHUB_SHA}" \
            ui
          test "$(docker inspect --format '{{.Config.User}}' "infinite-ocean-public-ui-ci:${GITHUB_SHA}")" = "node"
          test "$(docker inspect --format '{{.Config.User}}' "infinite-ocean-private-ui-ci:${GITHUB_SHA}")" = "65532:65532"
          if docker run --rm --entrypoint /bin/sh "infinite-ocean-public-ui-ci:${GITHUB_SHA}" -c 'command -v npm || command -v corepack'; then
            echo "public UI runtime includes forbidden package tooling" >&2
            exit 1
          fi
          public_container_id="$(docker run --detach --publish 127.0.0.1::3000 "infinite-ocean-public-ui-ci:${GITHUB_SHA}")"
          private_container_id="$(docker run --detach --publish 127.0.0.1::8080 "infinite-ocean-private-ui-ci:${GITHUB_SHA}")"
          trap 'docker rm --force "${public_container_id}" "${private_container_id}" >/dev/null 2>&1 || true' EXIT
          public_port="$(docker inspect --format '{{(index (index .NetworkSettings.Ports "3000/tcp") 0).HostPort}}' "${public_container_id}")"
          private_port="$(docker inspect --format '{{(index (index .NetworkSettings.Ports "8080/tcp") 0).HostPort}}' "${private_container_id}")"
          for attempt in $(seq 1 30); do
            if curl --fail --silent "http://127.0.0.1:${public_port}/health/ready" >/dev/null && \
               curl --fail --silent "http://127.0.0.1:${private_port}/health/ready" >/dev/null; then
              break
            fi
            if [[ "${attempt}" == 30 ]]; then
              docker logs "${public_container_id}"
              docker logs "${private_container_id}"
              exit 1
            fi
            sleep 1
          done
      - name: Scan customer UI runtime images
        run: |
          set -euo pipefail
          for image in "infinite-ocean-public-ui-ci:${GITHUB_SHA}" "infinite-ocean-private-ui-ci:${GITHUB_SHA}"; do
            docker run --rm \
              --volume /var/run/docker.sock:/var/run/docker.sock \
              docker.io/aquasec/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
              image \
              --image-src docker \
              --scanners vuln,secret \
              --severity HIGH,CRITICAL \
              --exit-code 1 \
              "${image}"
          done
      - name: Validate observability artifacts
        env:
          COLLECTOR_IMAGE: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.159.0@sha256:1f2c54a30e713fac6b3ae77a1ec84010c2007e29ced8ec666214fc2f6739c1cc
          PROMETHEUS_IMAGE: quay.io/prometheus/prometheus:v3.14.0@sha256:5ce7540c3c00ef4ab0c9d2c995c6a5b9c421f44b4a115d97a2c7af3b1c21cbb0
        run: |
          jq -e . deploy/observability/grafana/spyglass-overview.json >/dev/null
          mkdir /tmp/spyglass-prometheus
          sed -n '/^spec:/,$p' deploy/kubernetes/reference/observability/prometheus-rule.yaml | tail -n +2 | sed 's/^  //' >/tmp/spyglass-prometheus/spyglass.rules.yaml
          cp deploy/observability/prometheus/spyglass.rules.test.yaml /tmp/spyglass-prometheus/
          docker run --rm \
            --entrypoint=/bin/promtool \
            --volume /tmp/spyglass-prometheus:/etc/prometheus/spyglass:ro \
            "$PROMETHEUS_IMAGE" check rules /etc/prometheus/spyglass/spyglass.rules.yaml
          docker run --rm \
            --entrypoint=/bin/promtool \
            --volume /tmp/spyglass-prometheus:/etc/prometheus/spyglass:ro \
            --workdir /etc/prometheus/spyglass \
            "$PROMETHEUS_IMAGE" test rules spyglass.rules.test.yaml
          docker run --rm \
            --env SPYGLASS_ENVIRONMENT=ci \
            --env SPYGLASS_OTEL_BACKEND_ENDPOINT=https://telemetry.invalid \
            --env 'SPYGLASS_OTEL_BACKEND_AUTHORIZATION=Bearer validation' \
            --volume "$PWD/deploy/kubernetes/reference/observability/collector.yaml:/etc/spyglass/collector.yaml:ro" \
            "$COLLECTOR_IMAGE" validate --config=/etc/spyglass/collector.yaml
