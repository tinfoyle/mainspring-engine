name: release Spyglass image

on:
  push:
    tags: ["spyglass-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Reviewed SemVer without a v prefix"
        required: true
        type: string

concurrency:
  group: release-image-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  id-token: write

env:
  IMAGE_NAME: ghcr.io/tinfoyle/spyglass-engine

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Check out exact release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Resolve immutable release identity
        id: release
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#spyglass-v}"
            [[ "${GITHUB_REF_NAME}" == "spyglass-v${version}" ]]
          else
            version="${REQUESTED_VERSION}"
          fi
          [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          (( ${#version} <= 64 ))
          created="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "created=${created}" >> "${GITHUB_OUTPUT}"

      - name: Configure BuildKit
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Authenticate to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse to overwrite release tags
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          for tag in "${VERSION}" "sha-${GITHUB_SHA}"; do
            if docker buildx imagetools inspect "${IMAGE_NAME}:${tag}" >/dev/null 2>&1; then
              echo "refusing to overwrite existing image tag ${IMAGE_NAME}:${tag}" >&2
              exit 1
            fi
          done

      - name: Build and push immutable multi-architecture image
        id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.release.outputs.version }}
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          build-args: |
            VERSION=${{ steps.release.outputs.version }}
            REVISION=${{ github.sha }}
            CREATED=${{ steps.release.outputs.created }}
          labels: |
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.release.outputs.created }}
          provenance: mode=max
          sbom: true

      - name: Enforce vulnerability and secret admission gate
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/trivy-cache"
          for platform in linux/amd64 linux/arm64; do
            docker run --rm \
              --env TRIVY_USERNAME \
              --env TRIVY_PASSWORD \
              --volume "${RUNNER_TEMP}/trivy-cache:/root/.cache/trivy" \
              docker.io/aquasec/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
              image \
              --image-src remote \
              --platform "${platform}" \
              --scanners vuln,secret \
              --severity HIGH,CRITICAL \
              --exit-code 1 \
              "${IMAGE_NAME}@${DIGEST}"
          done

      - name: Install verified Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign immutable image digest
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: cosign sign --yes "${IMAGE_NAME}@${DIGEST}"

      - name: Publish release identity
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          {
            echo "### Spyglass ${VERSION}"
            echo '```text'
            echo "${IMAGE_NAME}@${DIGEST}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
